/* Edit history: every save (with undo), fields locked against email, and email values that were held back. */
function edFmt(table, k, v){
  const f = edFields(table)[k] || {};
  if(v==null || v==="" || (Array.isArray(v)&&!v.length)) return "—";
  if(f.type==="people") return v.map(personName).join(", ");
  if(f.type==="person") return personName(v);
  if(f.type==="work_order") return woName(v);
  if(f.type==="bool") return v ? "Yes" : "No";
  if(f.type==="date") return dayOnly(String(v).slice(0,10)).replace(/<[^>]+>/g,"");
  if(f.type==="number") return Number(v).toLocaleString();
  const s = Array.isArray(v) ? v.join(", ") : String(v);
  return s.length>140 ? s.slice(0,140)+"…" : s;
}
async function paintHistory(table, id){
  const box=$("#edHistBody"); if(!box) return; box.innerHTML=`<span class="muted">Loading…</span>`;
  let rows; try{ rows = await rpc("eos_history",{p_table:table, p_id:id}); }catch(err){ box.innerHTML=`<span class="muted">${esc(err.message)}</span>`; return; }
  if(route.id!==id) return;
  const F = edFields(table), lbl = k => (F[k]&&F[k].label) || k;
  const locked = [...new Set(rows.filter(r=>r.locked && r.action==="update").map(r=>r.field))];
  const groups = []; const seen = new Map();
  rows.forEach(r=>{ const key = r.batch_id || `${r.action}:${r.at}:${r.field}`; if(!seen.has(key)){ seen.set(key, {key, batch:r.batch_id, action:r.action, at:r.at, actor:r.actor, note:r.note, items:[]}); groups.push(seen.get(key)); } seen.get(key).items.push(r); });
  const html = groups.map(g=>{
    const when = esc(evDate(g.at));
    if(g.action==="create") return `<li><b>Created in the app</b><span>${when}${g.actor?` · ${esc(g.actor)}`:""}</span></li>`;
    if(g.action==="unlock") return `<li><b>Email may update ${esc(lbl(g.items[0].field))} again</b><span>${when}</span></li>`;
    if(g.action==="ingest_blocked") return g.items.map(r=>`<li class="blk"><b>An email tried to change ${esc(lbl(r.field))}</b><span>${when}</span>
        <div class="hv">to “${esc(edFmt(table,r.field,r.new_value))}” — your “${esc(edFmt(table,r.field,r.old_value))}” was kept
        <button type="button" class="linkbtn" data-apply='${esc(JSON.stringify({[r.field]:r.new_value}))}'>Use the email's value</button></div></li>`).join("");
    return `<li><b>${g.note && /^Undo/.test(g.note) ? "Undo" : "Edited"}</b><span>${when}${g.actor?` · ${esc(g.actor)}`:""}${g.batch&&!/^Undo/.test(g.note||"")?` · <button type="button" class="linkbtn" data-undo="${esc(g.batch)}">Undo</button>`:""}</span>
      ${g.items.map(r=>`<div class="hv"><i>${esc(lbl(r.field))}</i> ${esc(edFmt(table,r.field,r.old_value))} → ${esc(edFmt(table,r.field,r.new_value))}</div>`).join("")}</li>`;
  }).join("");
  box.innerHTML = (locked.length ? `<div class="ed-locks"><span>Kept against email updates:</span> ${locked.map(k=>`<span class="ed-lock">${esc(lbl(k))}<button type="button" data-unlock="${esc(k)}" title="Let email updates change this field again">unlock</button></span>`).join(" ")}</div>` : "")
    + (groups.length ? `<ol class="ed-hist">${html}</ol>` : `<span class="muted">No edits made in the app yet.</span>`);
  box.onclick = async e=>{
    const b=e.target.closest("button"); if(!b) return; b.disabled=true;
    try{
      if(b.dataset.undo){ const r=await rpc("eos_undo",{p_batch:b.dataset.undo}); await refreshAfterEdit(); $("#detail").innerHTML=""; render(); editToast(r.skipped&&r.skipped.length?`Undone, except ${r.skipped.map(lbl).join(", ")} (changed again since)`:"Undone"); }
      else if(b.dataset.unlock){ await rpc("eos_unlock_field",{p_table:table, p_id:id, p_field:b.dataset.unlock}); paintHistory(table,id); editToast(`Email updates may change ${lbl(b.dataset.unlock)} again`); }
      else if(b.dataset.apply){ const r=await rpc("eos_edit",{p_table:table, p_id:id, p_patch:JSON.parse(b.dataset.apply), p_note:"Applied a value an email had sent"}); await refreshAfterEdit(); $("#detail").innerHTML=""; render(); editToast("Applied", r.batch); }
    }catch(err){ b.disabled=false; editToast(edError(err.message)); }
  };
}
const historySection = (table, id) => canEdit(table) ? `<div class="sec"><details id="edHist" data-t="${esc(table)}" data-id="${esc(id)}"><summary><h4 style="display:inline">Edit history</h4></summary><div id="edHistBody"></div></details></div>` : "";
function wireHistory(){ const d=$("#edHist"); if(d) d.addEventListener("toggle", ()=>{ if(d.open) paintHistory(d.dataset.t, d.dataset.id); }); }

function editToast(msg, undoBatch){
  let t=$("#edToast"); if(!t){ t=document.createElement("div"); t.id="edToast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML=`<span>${esc(msg)}</span>${undoBatch?`<button type="button">Undo</button>`:""}`; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), undoBatch?9000:4000);
  if(undoBatch) t.querySelector("button").onclick=async()=>{ t.classList.remove("show");
    try{ const r=await rpc("eos_undo",{p_batch:undoBatch}); await refreshAfterEdit(); $("#detail").innerHTML=""; render(); editToast(r.skipped&&r.skipped.length?`Undone, except ${r.skipped.join(", ")}`:"Undone"); }
    catch(err){ editToast(edError(err.message)); } };
}

/* ── Uploads (v114): file → private Storage bucket "eos-uploads" → documents row (eos_register_upload).
   The Document Filer then moves it into Drive (EOS Documents → App uploads) within ~10 minutes and removes the Storage copy. */
const UPLOAD_MAX = 50 * 1024 * 1024;
const canUpload = () => canEdit("documents") && !!(EDIT.cfg.tables.documents||{}).upload;
async function openUpload(prefill){
  if(!canUpload()) return;
  await loadDocuments().catch(()=>{});
  closeUpload();
  const F = edFields("documents"), pre = prefill||{};
  const fields = ["document_category","doc_date","location_text","work_order_id","task_id","description"].filter(k=>F[k]);
  const ov = document.createElement("div"); ov.id="upModal"; ov.className="ed-modal";
  ov.innerHTML = `<form class="ed-dialog" id="upForm" novalidate>
      <div class="ed-dh"><h3>Upload documents</h3><button type="button" class="ed-x" id="upX" title="Close">×</button></div>
      <label class="up-drop" id="upDrop"><input type="file" id="upFiles" multiple hidden><b>Choose files</b> or drop them here<small>PDF, Office, images, drawings — up to 50 MB each</small></label>
      <div id="upList" class="up-list"></div>
      <div class="ed-grid">
        ${F.title?`<div class="ed-f wide" id="upTitleRow"><label for="ef_title">Title <small class="muted">(one file only — otherwise the document reader names them)</small></label>${edInput("documents","title",F.title,"")}</div>`:""}
        ${fields.map(k=>{ const f=F[k], wide=!ED_SHORT.has(f.type)||k==="location_text"; return `<div class="ed-f${wide?" wide":""}"><label for="ef_${k}">${esc(f.label)}</label>${edInput("documents",k,f,pre[k]??"")}</div>`; }).join("")}
      </div>
      <p class="ed-hint" style="margin-top:12px">Anything you leave blank is filled in by the document reader on its next run. What you type is kept.</p>
      <div class="ed-foot"><span class="ed-err" id="upErr"></span><button type="button" class="tbtn" id="upCancel">Cancel</button><button type="submit" class="btn-update" id="upGo" disabled>Upload</button></div>
    </form>`;
  document.body.appendChild(ov);
  let files = [];
  const paint = () => {
    $("#upList").innerHTML = files.map((f,i)=>`<div class="up-f"><span class="ico">${esc((f.name.split(".").pop()||"file").slice(0,4))}</span><span class="nm">${esc(f.name)}</span><span class="muted">${fmtBytes(f.size)}</span>${f.size>UPLOAD_MAX?`<span class="flag over">Too large</span>`:""}<span class="st" id="upSt${i}"></span><button type="button" data-rm="${i}" title="Remove">×</button></div>`).join("");
    $("#upGo").disabled = !files.length || files.some(f=>f.size>UPLOAD_MAX);
    $("#upGo").textContent = files.length>1 ? `Upload ${files.length} files` : "Upload";
    const tr=$("#upTitleRow"); if(tr) tr.style.display = files.length>1 ? "none" : "";
  };
  const add = list => { files = files.concat([...list].filter(f=>f.size>0)); paint(); };
  $("#upFiles").addEventListener("change", e=>{ add(e.target.files); e.target.value=""; });
  const drop=$("#upDrop");
  ["dragenter","dragover"].forEach(t=>drop.addEventListener(t, e=>{ e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(t=>drop.addEventListener(t, e=>{ e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e=>add(e.dataTransfer.files));
  $("#upList").addEventListener("click", e=>{ const i=e.target.closest("[data-rm]")?.dataset.rm; if(i!=null){ files.splice(+i,1); paint(); } });
  $("#upX").onclick = $("#upCancel").onclick = closeUpload;
  ov.addEventListener("mousedown", e=>{ if(e.target===ov) closeUpload(); });
  ov.addEventListener("keydown", e=>{ if(e.key==="Escape") closeUpload(); });
  $("#upForm").addEventListener("submit", async e=>{
    e.preventDefault(); if(!files.length) return;
    const form=$("#upForm"), vals={};
    ["title",...fields].forEach(k=>{ if(!F[k]) return; if(k==="title" && files.length>1) return; const v=edRead(form,k,F[k]); if(!edBlank(v)) vals[k]=v; });
    $("#upGo").disabled=true; $("#upCancel").disabled=true; $("#upErr").textContent="";
    const made=[]; let failed=0;
    for(let i=0;i<files.length;i++){
      const f=files[i], st=$(`#upSt${i}`); st.textContent="Uploading…";
      try{
        const safe = f.name.replace(/[^\w.\- ()]+/g,"_").replace(/\s+/g," ").trim() || "file";
        const path = `uploads/${(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}/${safe}`;
        const r = await fetch(`${SUPABASE_URL}/storage/v1/object/eos-uploads/${path.split("/").map(encodeURIComponent).join("/")}`, {
          method:"POST", headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${await authToken()}`, "Content-Type": f.type||"application/octet-stream", "x-upsert":"false" }, body:f });
        if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message||j.error||`${r.status} ${r.statusText}`); }
        const res = await rpc("eos_register_upload", { p_path:path, p_filename:f.name, p_type:f.type||null, p_size:f.size, p_values:vals });
        made.push(res.id); st.textContent="✓"; st.className="st ok";
      }catch(err){ failed++; st.textContent=edError(err.message); st.className="st bad"; }
    }
    cache.docs={}; D.docCounts=null; await loadCore(); await loadDocuments(true).catch(()=>{});
    if(failed){ $("#upErr").textContent=`${failed} file${failed===1?"":"s"} didn't upload — see the list.`; $("#upCancel").disabled=false; $("#upCancel").textContent="Close"; render(); return; }
    closeUpload();
    if(made.length===1) go("documents", made[0]); else render();
    editToast(`${made.length} file${made.length===1?"":"s"} uploaded — moved into Drive within about 10 minutes`);
  });
  setTimeout(()=>drop.focus?.(),20);
}
function closeUpload(){ $("#upModal")?.remove(); }

/* ═════════ CHAT (v105) ═════════ */
/* Ask questions about EOS data. One box to start; after the first question it becomes a conversation.
   The conversation lives ONLY in this browser tab (UI.chat) — nothing is saved anywhere; "New chat" or
   closing the tab clears it. Answers come from the eos-chat Edge Function, which runs read-only queries
   as the signed-in user, so Chat sees exactly what that person can see in EOS and can't change anything. */
UI.chat = { msgs:[], busy:false, err:"" };
const CHAT_STARTERS = ["What's overdue right now?","What did our team complete this week?","Summarize where the Dunham/Brimbal roundabout stands","Which work orders have the most open tasks?"];
function chatMD(txt){
  // small, safe markdown: escape first, then **bold**, `code`, headings, lists, simple tables, and EOS links
  const T=new Map((D.tasks||[]).map(t=>[t.task_id,t])), W=new Map((D.workorders||[]).map(w=>[woNum(w),w]));
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/#(\d{5})\b/g,(m,id)=>T.has(id)?`<a href="#/tasks/${esc(T.get(id).id)}">#${id}</a>`:m)
    .replace(/\bW-(\d{4})\b/g,(m)=>W.has(m)?`<a href="#/workorders/${esc(W.get(m).id)}">${m}</a>`:m);
  const lines=String(txt||"").replace(/\r/g,"").split("\n"); let out="", list=null, tbl=[];
  const flushList=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  const flushTbl=()=>{ if(!tbl.length) return; const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>c.trim()));
    out+=`<div class="cm-tbl"><table><thead><tr>${rows[0].map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl=[]; };
  for(const ln of lines){
    if(/^\s*\|.*\|\s*$/.test(ln)){ flushList(); tbl.push(ln); continue; } else flushTbl();
    let m;
    if((m=ln.match(/^\s*[-*•]\s+(.*)$/))){ if(list!=="ul"){ flushList(); out+="<ul>"; list="ul"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){ flushList(); out+="<ol>"; list="ol"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    flushList();
    if((m=ln.match(/^\s*#{1,4}\s+(.*)$/))){ out+=`<h4>${inline(m[1])}</h4>`; continue; }
    if(!ln.trim()){ out+=""; continue; }
    out+=`<p>${inline(ln)}</p>`;
  }
  flushList(); flushTbl(); return out;
}
const chatRerender = () => route.page==="home" ? render() : renderChat();
async function chatSend(text){
  const ui=UI.chat, q=String(text||"").trim(); if(!q || ui.busy) return;
  ui.msgs.push({role:"user", content:q}); ui.busy=true; ui.err=""; chatRerender();
  try{
    const tok = await authToken(); if(!tok) throw new Error("Sign in to EOS to use Chat.");
    const r = await fetch(`${SUPABASE_URL}/functions/v1/eos-chat`, {method:"POST", headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${tok}`, "Content-Type":"application/json"},
      body: JSON.stringify({ messages: ui.msgs.map(m=>({role:m.role, content:m.content})), who: (ME&&ME.full_name)||"" })});
    const j = await r.json().catch(()=>({error:`HTTP ${r.status}`}));
    if(!r.ok || j.error){ ui.err = j.error==="waiting_for_key" ? (j.message||"Chat is waiting for its API key.") : (j.error||`HTTP ${r.status}`); ui.msgs.pop(); ui.pending=q; }
    else ui.msgs.push({role:"assistant", content:j.answer||""});
  }catch(e){ ui.err = e.message||String(e); ui.msgs.pop(); ui.pending=q; }
  ui.busy=false; chatRerender();
}
const chatClear = () => { const ui=UI.chat; ui.msgs=[]; ui.err=""; ui.pending=""; };
function chatBoxHTML(started){ const ui=UI.chat, keep=$("#chatIn") ? $("#chatIn").value : (ui.pending||"");
  return `<div class="cbox"><textarea id="chatIn" rows="1" placeholder="${started?"Ask a follow-up…":"Ask anything about EOS — tasks, work orders, meetings, people…"}" ${ui.busy?"disabled":""}>${esc(keep)}</textarea><button id="chatGo" title="Send (Enter)" ${ui.busy?"disabled":""}>↑</button></div>`; }
function chatConvHTML(){ const ui=UI.chat;
  const bubbles = ui.msgs.map(m=>`<div class="cm ${m.role==="user"?"me":"ai"}">${m.role==="user"?`<div class="cm-b">${esc(m.content).replace(/\n/g,"<br>")}</div>`:`<div class="cm-b md">${chatMD(m.content)}</div>`}</div>`).join("");
  return `<div class="chat on"><div class="cmsgs" id="chatMsgs">${bubbles}${ui.busy?`<div class="cm ai"><div class="cm-b typing"><i></i><i></i><i></i> Looking through EOS…</div></div>`:""}${ui.err?`<div class="cm-err">${esc(ui.err)}</div>`:""}</div>${chatBoxHTML(true)}</div>`; }
const chatStartersHTML = () => `<div class="cstart">${CHAT_STARTERS.map(x=>`<button data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
function wireChat(){ const ui=UI.chat, ta=$("#chatIn"); if(!ta) return;
  const go=()=>{ const v=ta.value; ui.pending=""; ta.value=""; chatSend(v); };
  const fit=()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,180)+"px"; };
  ta.addEventListener("input",fit); fit();
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); go(); } });
  $("#chatGo").addEventListener("click",go);
  $("#content").querySelectorAll(".cstart button").forEach(b=>b.addEventListener("click",()=>chatSend(b.dataset.q)));
  const ms=$("#chatMsgs"); if(ms) ms.scrollTop=ms.scrollHeight;
  if(ui.msgs.length && !ui.busy) ta.focus();
}
function renderChat(){
  const ui=UI.chat, started=ui.msgs.length>0;
  if(mountBar("chat", `<h1>Chat</h1><span class="muted">Ask about anything in EOS · read-only · not saved</span><span class="grow"></span><button class="tbtn" id="chatNew">New chat</button>`))
    $("#chatNew").addEventListener("click",()=>{ chatClear(); renderChat(); });
  $("#chatNew").hidden = !started;
  $("#detail").innerHTML=""; $("#body").classList.remove("open");
  $("#content").innerHTML = started ? chatConvHTML()
    : `<div class="chat"><div class="chat-hero"><h2>What would you like to know?</h2><p class="muted">Answers come from EOS data you can see. Chat can't change anything, and nothing you ask is saved.</p>${chatBoxHTML(false)}${ui.err?`<div class="cm-err">${esc(ui.err)}</div>`:""}${chatStartersHTML()}</div></div>`;
  wireChat();
}

    const gj = await agolFetch(`${l.service_url}/query?where=1%3D1${geo}&outFields=*&outSR=4326&orderByFields=${encodeURIComponent(oid)}&resultOffset=${off}&resultRecordCount=${page}&f=geojson`);

  const direct=(D.tasks||[]).filter(t=>t.project_id===p.id && !t.work_order_id).sort((a,b)=>(STO[a.status]??9)-(STO[b.status]??9)||(PRI[a.priority]??9)-(PRI[b.priority]??9));
  const lead=p.lead_name?`<a href="#/people/${esc(p.lead_id)}">${esc(p.lead_name)}</a>`:`<span class="muted">None</span>`;
  const when=v=>v?esc(fd(dayOf(v))):"…";
  const dates=(p.start_date||p.target_end_date||p.actual_end_date) ? `${when(p.start_date)} → ${p.actual_end_date?when(p.actual_end_date)+" (done)":p.kind==="Program"?"ongoing":when(p.target_end_date)}` : (p.kind==="Program"?"Ongoing":`<span class="muted">Not set</span>`);
  const ms=(Array.isArray(p.milestones)?p.milestones:[]).slice().sort((a,b)=>String(a.target||"9").localeCompare(String(b.target||"9")));
  const today=new Date().toISOString().slice(0,10);
  const msHTML = ms.length ? `<ol class="mst">${ms.map(m=>{ const late=!m.done&&m.target&&m.target<today;
      return `<li class="${m.done?"done":late?"late":""}"><span class="dot"></span><div><b>${esc(m.name||"")}</b><small>${m.done?`Done ${when(m.done)}`:m.target?`${late?"Overdue · ":"Target "}${when(m.target)}`:"No date"}</small></div></li>`; }).join("")}</ol>`
    : `<div class="muted">No milestones yet${canEdit("projects")?" — add them with ✎ Edit":""}.</div>`;
  const money2=[p.budget!=null?["Budget",money(p.budget)]:null, p.estimated_cost!=null?["Estimated cost",money(p.estimated_cost)]:null,
    (p.funding_sources||[]).length?["Funding",esc(p.funding_sources.join(", "))]:null, p.capital_plan?["Capital plan","Yes"]:null].filter(Boolean);
  const contract=[p.contractor_name?["Contractor",esc(p.contractor_name)]:null, p.contract_number?["Contract #",esc(p.contract_number)]:null,
    (p.po_numbers||[]).length?["PO",esc(p.po_numbers.join(", "))]:null].filter(Boolean);
  const kv=list=>`<div class="kv">${list.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
  el.innerHTML=`<div class="dh ${tintFor(p.status,false)}"><div style="min-width:0"><div class="id">${p.kind==="Program"?"PROGRAM":"PROJECT"} <span class="mono">${esc(p.project_ref)}</span></div><h2>${esc(p.name)}</h2>${p.description?`<div class="instr">${esc(p.description)}</div>`:""}<div class="badges">${pill(p.status)}${prio(p.priority)}${p.phase?`<span class="phase">${esc(p.phase)}</span>`:""}</div>${canEdit("projects")?`<div class="ed-row"><button class="ed-btn" id="edBtn" title="Edit this ${p.kind.toLowerCase()}">✎ Edit</button></div>`:""}</div><div class="dh-actions"><button title="Close" onclick="go(route.page)">×</button></div></div>
    <div class="db">
      ${glance([["Lead",lead],["Dates",dates],["Type",p.project_type?esc(p.project_type):`<span class="muted">Not set</span>`],["Category",p.project_category?esc(p.project_category):`<span class="muted">Not set</span>`],
               ["Progress",`${pctBar(p.pct_complete)} <span class="muted">${p.open_tasks||0} open · ${p.done_tasks||0} done${p.overdue_tasks?` · <b style="color:var(--s-blocked)">${p.overdue_tasks} overdue</b>`:""}</span>`],
               p.department?["Department",esc(p.department)]:null])}
      ${p.summary?`<div class="sec"><h4>Summary</h4><div class="wo-summary">${esc(p.summary)}</div></div>`:""}
      <div class="sec"><h4>Milestones <span>${ms.filter(m=>m.done).length}/${ms.length}</span></h4>${msHTML}</div>
      ${money2.length||contract.length?`<div class="sec"><h4>Budget &amp; contract</h4>${money2.length?kv(money2):""}${contract.length?kv(contract):""}</div>`:""}
      <div class="sec"><h4>Details</h4>${p.notes?detailsHTML(p.notes, WO_DETAIL_SECTIONS):`<div class="muted">No details recorded</div>`}</div>
      <div class="sec"><h4>Work orders <span>${wos.length}${canEdit("work_orders")?` <button class="h4btn" id="prNewWo">+ Work order</button>`:""}</span></h4>${wos.length?wos.map(w=>`<div class="link-row" onclick="go('workorders','${esc(w.id)}')"><span><span class="mono">${esc(woNum(w))}</span> ${esc(w.project_name)}<small>${w.open_tasks||0} open · ${w.completed_tasks||0} done${w.lead_worker_name?` · ${esc(w.lead_worker_name)}`:""}</small></span>${pill(w.status)}</div>`).join(""):`<div class="muted">No work orders yet.</div>`}</div>
      <div class="sec"><h4>Project tasks <span>${direct.length}${canEdit("tasks")?` <button class="h4btn" id="prNewTask">+ Task</button>`:""}</span></h4><div class="muted" style="font-size:11.5px;margin:-2px 0 6px">Coordination and admin items that sit directly on the ${p.kind.toLowerCase()} (tasks inside work orders are listed on each work order).</div>${direct.length?direct.map(t=>`<div class="link-row" onclick="go('tasks','${esc(t.id)}')"><span><span class="mono">${esc(t.task_id)}</span> ${esc(ttl(t))}<small>${esc((t.labor_names||[]).join(", ")||"No labor")}${t.due_date?` · due ${esc(fd(dayOf(t.due_date)))}`:""}</small></span>${pill(t.status)}</div>`).join(""):`<div class="muted">None.</div>`}</div>
      ${historySection("projects", p.id)}
    </div>`;
  $("#edBtn")?.addEventListener("click",()=>startEdit("projects",p.id));
  $("#prNewWo")?.addEventListener("click",()=>startNew("work_orders","workorders",{project_id:p.id}));
  $("#prNewTask")?.addEventListener("click",()=>startNew("tasks","tasks",{project_id:p.id}));
  wireHistory();
}

/* ═════════ WORK ORDERS (OpenGov) ═════════ */
function renderWorkOrders(){
  // v104: mirrors Tasks — one tile per status (click to show/hide), search, grouping, same table style.
  const ui=UI.workorders, all=D.workorders||[];
  if(!ui.statuses) ui.statuses = new Set(["In Progress","Planned"]);
  ui.group = ui.group || "none";
  if(mountBar("workorders", `<h1>Work Orders</h1><input type="search" id="q" placeholder="Search work orders, aliases, leads, categories…" value="${esc(ui.q)}">
    <select id="grp"><option value="none"${ui.group==="none"?" selected":""}>No grouping</option><option value="lead"${ui.group==="lead"?" selected":""}>Group by lead</option><option value="dept"${ui.group==="dept"?" selected":""}>Group by department</option><option value="category"${ui.group==="category"?" selected":""}>Group by category</option></select>
    <span class="grow"></span>${canEdit("work_orders")?`<button class="tbtn new" id="newBtn">+ New work order</button>`:""}<button class="tbtn" id="expBtn" title="Download what this list is showing">⤓ Export</button><button onclick="window.print()" class="tbtn">Print</button>`)){
    $("#q").addEventListener("input",e=>{ui.q=e.target.value;render();});
    $("#grp").addEventListener("change",e=>{ui.group=e.target.value;render();});
    $("#expBtn").addEventListener("click",e=>listExportMenu(e.currentTarget,"workorders"));
    $("#newBtn")?.addEventListener("click",()=>startNew("work_orders","workorders"));
  }
  const ORDER=["In Progress","Planned","Completed","Canceled"];
  const present=[...new Set(all.map(w=>w.status).filter(Boolean))];
  const stList=[...ORDER.filter(x=>present.includes(x)||x==="In Progress"||x==="Planned"), ...present.filter(x=>!ORDER.includes(x)).sort()];
  const tiles=stList.map(st=>[st, STATUS[st]||st, all.filter(w=>w.status===st).length, "tst-"+stSlug(st)]);
  let rows=all.filter(w=>!ui.statuses.size || ui.statuses.has(w.status));
  setHL(ui.q);
  if(ui.q){const q=ui.q.toLowerCase(); rows=rows.filter(w=>hay(woNum(w),w.opengov_id,w.project_name,w.description,w.summary,w.legacy_id,w.lead_worker_name,w.owner_name,w.organization_name,w.contractor_name,w.aliases,w.project_category,w.project_type,w.progress_phase,w.department,w.location_1,w.location_2).includes(q));}
  rows=sortBy(rows,ui.sort,ui.dir,{ priority:(a,b)=>((PRI[a.priority]??9)-(PRI[b.priority]??9))||((STO[a.status]??9)-(STO[b.status]??9)), status:(a,b)=>(STO[a.status]??9)-(STO[b.status]??9) });
  ui.lastRows = rows;
  const c=!!route.id;
  const cols = c ? `<colgroup><col style="width:72px"><col><col style="width:92px"><col style="width:80px"><col style="width:120px"><col style="width:54px"></colgroup>`
                 : `<colgroup><col style="width:80px"><col><col style="width:104px"><col style="width:92px"><col style="width:150px"><col style="width:150px"><col style="width:64px"><col style="width:96px"></colgroup>`;
  const header = `<thead><tr>${th("ID","work_order_number",ui)}${th("Work order","project_name",ui)}${th("Status","status",ui)}${th("Priority","priority",ui)}${th("Lead","lead_worker_name",ui)}${c?"":th("Progress phase","progress_phase",ui)}${th("Open","open_tasks",ui)}${c?"":th("Activity","last_activity",ui)}</tr></thead>`;
  const row = w => `<tr class="r${route.id===w.id?" sel":""}" data-id="${esc(w.id)}" tabindex="0">
     ${idCell(woNum(w), w.opengov_id)}
     <td><div class="t">${hl(w.project_name)}</div>${w.description&&!c?`<div class="d">${hl(w.description)}</div>`:""}</td>
     <td>${pill(w.status)}</td><td>${prio(w.priority)}</td>
     <td class="ellip">${w.lead_worker_name?hl(w.lead_worker_name):`<span class="muted">—</span>`}</td>
     ${c?"":`<td class="ellip">${w.progress_phase?esc(w.progress_phase):`<span class="muted">—</span>`}</td>`}
     <td class="num">${w.open_tasks||`<span class="muted">—</span>`}</td>
     ${c?"":`<td class="num muted" title="${esc(fdt(w.last_activity||w.last_modified))}">${esc(ago(w.last_activity||w.last_modified))}</td>`}</tr>`;
  let tbl;
  if(!all.length) tbl=`<div class="empty"><h3>No work orders yet</h3><p>The ingest creates a work order only when an email shows enough signals of a multi-step initiative (see <code>settings.work_order_min_signals</code>).</p></div>`;
  else if(!rows.length) tbl=`<div class="empty"><h3>Nothing matches</h3><p>Turn on another status tile or clear the search.</p></div>`;
  else if(ui.group!=="none"){
    const keyOf = w => ui.group==="lead" ? (w.lead_worker_name||"No lead") : ui.group==="dept" ? (w.department||"No department") : (w.project_category||"No category");
    const groups=new Map(); rows.forEach(w=>{ const k=keyOf(w); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(w); });
    ui.collapsed = ui.collapsed || new Set(); const gkey=k=>ui.group+"::"+k;
    const ordered=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length);
    tbl = `<div class="grp-tools"><span class="muted">${ordered.length} group${ordered.length!==1?"s":""} · ${rows.length} work order${rows.length!==1?"s":""}</span></div>`+
      ordered.map(([k,ws])=>{ const cl=ui.collapsed.has(gkey(k)); const op=ws.reduce((n,w)=>n+(+w.open_tasks||0),0);
        return `<div class="tbl grp${cl?" closed":""}" style="margin-bottom:10px"><div class="ch grp-h" data-g="${esc(k)}" role="button" tabindex="0"><h3><span class="chev">▾</span>${esc(k)}</h3><span class="muted">${ws.length} work order${ws.length!==1?"s":""}${op?` · ${op} open tasks`:""}</span></div>${cl?"":`<div class="scroll"><table>${cols}${header}<tbody>${ws.map(row).join("")}</tbody></table></div>`}</div>`; }).join("");
  } else tbl = `<div class="tbl"><div class="scroll"><table>${cols}${header}<tbody>${rows.map(row).join("")}</tbody></table></div><div class="foot-row"><span>${rows.length} of ${all.length} work orders</span></div></div>`;
  $("#content").innerHTML = `<div class="tiles">${tiles.map(([k,l,n,cl])=>`<div class="tile stt ${cl} ${ui.statuses.has(k)?"on":""}" data-f="${esc(k)}" role="button" aria-pressed="${ui.statuses.has(k)}" title="Click to ${ui.statuses.has(k)?"hide":"show"} ${esc(l)}"><b>${n}</b><span>${esc(l)}</span></div>`).join("")}</div>${tbl}`;
  $("#content").querySelectorAll(".tile").forEach(x=>x.addEventListener("click",()=>{ const st=x.dataset.f; ui.statuses.has(st)?ui.statuses.delete(st):ui.statuses.add(st); render(); }));
  $("#content").querySelectorAll("tr.r").forEach(tr=>{ tr.addEventListener("click",()=>go("workorders",tr.dataset.id)); tr.addEventListener("keydown",e=>{if(e.key==="Enter")go("workorders",tr.dataset.id);}); });
  $("#content").querySelectorAll(".tbl").forEach(tb=>wireSort(tb,ui,{open_tasks:-1,last_activity:-1}));
  $("#content").querySelectorAll(".grp-h").forEach(h=>{ const t=()=>{ const k=ui.group+"::"+h.dataset.g; ui.collapsed.has(k)?ui.collapsed.delete(k):ui.collapsed.add(k); render(); };
    h.addEventListener("click",t); h.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); t(); } }); });
  renderWorkOrderDetail();
}

      <thead><tr>${th("Organization","name",ui)}${th("Type","org_type",ui)}<th>Domains</th>${th("People","people_count",ui)}${th("Open tasks","open_tasks",ui)}${th("Work orders","work_order_count",ui)}${th("Last contact","last_contact_at",ui)}</tr></thead>
      <tbody>${rows.map(o=>`<tr class="r${route.id==="org:"+o.id?" sel":""}" data-id="org:${esc(o.id)}"><td><div class="t">${esc(o.name)}</div>${o.is_internal?`<div class="type">internal</div>`:""}</td><td class="type">${esc((o.org_type||"").replace(/_/g," "))}</td><td class="mono" style="font-size:11px">${(o.domains||[]).map(esc).join(", ")||"—"}</td><td class="num">${o.people_count}</td><td class="num">${o.open_tasks}</td><td class="num">${o.work_order_count}</td><td class="num muted">${esc(ago(o.last_contact_at))}</td></tr>`).join("")}</tbody></table></div></div>`;
  }else{
    let rows=ppl.filter(p=>ui.scope==="all"||p.person_type===ui.scope).filter(p=>!ui.dept||p.department===ui.dept).filter(p=>!q||hay(p.full_name,p.email_address,p.title,p.person_type,p.department,p.organization_name,p.work_phone,p.cellular,p.opengov_labor_id,p.user_account,p.supervisor_name).includes(q));
    rows=sortBy(rows,ui.sort,ui.dir); ui.lastRows=rows; ui.lastKind="people";

      `<div class="tbl"><div class="scroll"><table><colgroup><col><col style="width:150px"><col style="width:180px"><col style="width:90px"><col style="width:160px"><col style="width:64px"><col style="width:56px"><col style="width:64px"><col style="width:92px"></colgroup>
      <thead><tr>${th("Name","full_name",ui)}${th("Organization","organization_name",ui)}${th("Department","department",ui)}${th("Type","person_type",ui)}${th("Title","title",ui)}${th("Labor ID","opengov_labor_id",ui)}${th("Open","open_tasks",ui)}${th("Emails","contact_count",ui)}${th("Last contact","last_contact_at",ui)}</tr></thead>
      <tbody>${rows.map(p=>`<tr class="r${route.id===p.id?" sel":""}" data-id="${esc(p.id)}"><td><div class="t">${hl(p.full_name||p.email_address)}${p.inactive?` <span class="muted" style="font-weight:400">· inactive</span>`:""}</div>${canSee("email_address")?`<div class="d"><a href="mailto:${esc(p.email_address)}" onclick="event.stopPropagation()">${hl(p.email_address)}</a>${p.work_phone||p.cellular?` · <span class="mono">${esc(p.work_phone||p.cellular)}</span>`:""}</div>`:""}</td><td class="ellip">${p.organization_name?`<a href="#/people/org:${esc(p.organization_id)}" onclick="event.stopPropagation()">${esc(p.organization_name)}</a>`:`<span class="muted">—</span>`}</td><td class="ellip">${hl(p.department||"—")}</td><td><span class="type">${esc(TYPE[p.person_type]||p.person_type||"—")}</span></td><td class="ellip">${hl(p.title||"—")}</td><td class="mono num" style="font-size:11px">${esc(p.opengov_labor_id||"—")}</td><td class="num">${p.open_tasks}</td><td class="num">${p.contact_count}</td><td class="num muted">${esc(ago(p.last_contact_at))}</td></tr>`).join("")}</tbody></table></div><div class="foot-row"><span>${rows.length} of ${ppl.length} people · ${orgs.length} organizations${ui.dept?` · ${esc(ui.dept)}`:""}</span></div></div>`;
  }
  $("#content").innerHTML=html;

  renderPersonDetail();
}
function renderPersonDetail(){
  const el=$("#detail"); if(!route.id){el.innerHTML="";return;}
  if(route.id.startsWith("org:")){
    const o=(D.orgs||[]).find(x=>"org:"+x.id===route.id); if(!o){el.innerHTML="";return;}
    const members=(D.people||[]).filter(p=>p.organization_id===o.id);
    const tasks=(D.tasks||[]).filter(t=>t.organization_id===o.id).filter(isOpen);
    const wos=(D.workorders||[]).filter(w=>w.organization_id===o.id);
    el.innerHTML=`<div class="dh"><div><div class="id">ORGANIZATION · ${esc((o.org_type||"").replace(/_/g," "))}</div><h2>${esc(o.name)}</h2></div><button onclick="go('people')">×</button></div><div class="db">
      <div class="sec"><dl class="kv"><dt>Domains</dt><dd class="mono" style="font-size:11.5px">${(o.domains||[]).map(esc).join(", ")||"—"}</dd>${o.website?`<dt>Website</dt><dd><a href="${esc(o.website)}" target="_blank" rel="noopener">${esc(o.website)}</a></dd>`:""}<dt>Last contact</dt><dd class="num">${esc(fdt(o.last_contact_at))}</dd></dl>${o.notes?`<div class="desc">${esc(o.notes)}</div>`:""}</div>
      <div class="sec"><h4>People <span>${members.length}</span></h4>${members.length?members.map(p=>`<div class="link-row" onclick="go('people','${esc(p.id)}')"><span class="who">${esc(p.full_name||p.email_address)}<small>${esc(p.title||p.email_address)}</small></span><span class="muted num">${p.open_tasks} open</span></div>`).join(""):`<span class="muted">None</span>`}</div>
      <div class="sec"><h4>Open tasks <span>${tasks.length}</span></h4>${tasks.length?tasks.map(t=>`<div class="link-row" onclick="go('tasks','${esc(t.id)}')"><span><span class="mono muted">${esc(t.task_id)}</span> <span class="t">${esc(ttl(t))}</span></span>${pill(t.status)}</div>`).join(""):`<span class="muted">None</span>`}</div>
      <div class="sec"><h4>Work orders <span>${wos.length}</span></h4>${wos.length?wos.map(w=>`<div class="link-row" onclick="go('workorders','${esc(w.id)}')"><span class="t">${esc(w.project_name)}</span>${pill(w.status)}</div>`).join(""):`<span class="muted">None</span>`}</div></div>`;
    return;
  }
  const p=(D.people||[]).find(x=>x.id===route.id); if(!p){el.innerHTML="";return;}
  const T=D.tasks||[];
  const rel=[["Assigned labor",T.filter(t=>(t.labor_ids||[]).includes(p.id))]].filter(([,x])=>x.length);

    ${p.role_title?`<div class="sec"><h4>Role</h4><div class="t">${esc(p.role_title)}</div><div class="type" style="text-transform:none">${esc(p.role_department||"")}${p.role_reports_to?` · reports to ${esc(p.role_reports_to)}`:""}</div>${(p.role_keywords||[]).length?`<div style="margin:6px 0">${(p.role_keywords||[]).map(k=>`<span class="flag" style="background:var(--chip);color:var(--fg2);margin:0 4px 4px 0;display:inline-block">${esc(k)}</span>`).join("")}</div>`:""}${p.role_summary?`<div class="desc" style="font-size:12px">${esc(p.role_summary)}</div>`:""}<div class="muted" style="font-size:11px;margin-top:4px">From the City job description — the ingest uses this to route work when an email doesn't name an owner.</div></div>`:(p.is_staff?`<div class="sec"><h4>Role</h4><div class="muted">No job description on file${p.title?` for “${esc(p.title)}”`:""}. Tasks in this area will be routed by department instead of by name.</div></div>`:"")}
    ${leadWOs.length?`<div class="sec"><h4>Work orders <span>${leadWOs.length}</span></h4>${leadWOs.map(w=>`<div class="link-row" onclick="go('workorders','${esc(w.id)}')"><span class="t">${esc(w.project_name)}</span>${pill(w.status)}</div>`).join("")}</div>`:""}
    ${rel.length?rel.map(([label,ts])=>`<div class="sec"><h4>${label} <span>${ts.filter(isOpen).length} open</span></h4>${ts.sort((a,b)=>(STO[a.status]??9)-(STO[b.status]??9)).slice(0,25).map(t=>`<div class="link-row" onclick="go('tasks','${esc(t.id)}')"><span><span class="mono muted">${esc(t.task_id)}</span> <span class="t">${esc(ttl(t))}</span></span>${pill(t.status)}</div>`).join("")}</div>`).join(""):(leadWOs.length?"":`<div class="sec"><span class="muted">Not attached to any task yet.</span></div>`)}

}

        <div class="ch" style="border:0;padding:12px 0 4px;border-top:1px solid var(--line-2);margin-top:8px"><h3>Ingest runs</h3><span class="muted">last ${runs.length} · scroll for more</span></div>
        <div class="scroll capped"><table><colgroup><col style="width:108px"><col style="width:82px"><col style="width:42px"><col style="width:62px"><col style="width:64px"><col style="width:54px"><col></colgroup><thead><tr><th>Started</th><th>Status</th><th title="New emails ingested this run">New</th><th title="Tasks created this run">Created</th><th title="Emails that matched an existing task and updated it instead of creating a new one">Updated</th><th title="Documents filed to Drive and recorded in this run">Filed</th><th>Summary</th></tr></thead><tbody>${runs.length?runs.map(r=>`<tr><td class="num" style="font-size:11.5px">${esc(fdt(r.started_at))}<div class="type">${r.finished_at?Math.round((new Date(r.finished_at)-new Date(r.started_at))/6e4)+" min":"…"}</div></td><td>${pill(r.status)}</td><td class="num">${r.emails_new??"—"}</td><td class="num">${r.tasks_created??"—"}</td><td class="num">${r.tasks_linked??"—"}</td><td class="num">${r.documents_filed??0}${r.documents_geocoded?`<div class="type">${r.documents_geocoded} mapped</div>`:""}</td><td class="summary" style="font-size:11.5px;color:var(--ink-2)">${linkifySummary(r.summary||r.error||"")}${r.emails_failed?` <span style="color:var(--s-blocked)">· ${r.emails_failed} failed</span>`:""}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">No runs recorded</td></tr>`}</tbody></table></div></div></div>

/* Turn the plain-text run summary into HTML with links: task numbers (00132, and the old 4-digit form), work order names, people names, org names. */
function linkifySummary(text){
  if(!text) return "";
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const targets = [];
  (D.workorders||[]).forEach(w=>{ if(w.project_name&&w.project_name.length>3) targets.push({s:w.project_name,href:`#/workorders/${w.id}`,cls:"lk-wo"}); (w.aliases||[]).forEach(a=>{ if(a&&a.length>4) targets.push({s:a,href:`#/workorders/${w.id}`,cls:"lk-wo"}); }); });
  (D.people||[]).forEach(p=>{ if(p.full_name&&p.full_name.includes(" ")) targets.push({s:p.full_name,href:`#/people/${p.id}`,cls:"lk-person"}); });
  (D.orgs||[]).forEach(o=>{ if(o.name&&o.name.length>3&&o.name!=="City of Beverly") targets.push({s:o.name,href:`#/people/org:${o.id}`,cls:"lk-org"}); });
  targets.sort((a,b)=>b.s.length-a.s.length);           // longest match first so "Independence Park Improvements" beats alias "Independence Park"
  const byLower = new Map(targets.map(t=>[t.s.toLowerCase(),t]));
  const taskByNum = new Map((D.tasks||[]).map(t=>[String(+t.task_id),t]));   // keyed by the bare number so 0132 and 00132 both resolve
  const alt = targets.length ? "|" + targets.map(t=>reEsc(t.s)).join("|") : "";
  const re = new RegExp(`(?<![\\w-])(\\d{4,6})(?![\\w-])${alt}`, "gi");
  let out="", last=0, m;
  while((m=re.exec(text))){
    out += esc(text.slice(last, m.index));
    const hit = m[0];
    if(m[1]){ const t=taskByNum.get(String(+m[1])); out += t ? `<a class="lk lk-task mono" href="#/tasks/${esc(t.id)}" title="${esc(ttl(t))}">${esc(hit)}</a>` : esc(hit); }
    else { const tg=byLower.get(hit.toLowerCase()); out += tg ? `<a class="lk ${tg.cls}" href="${tg.href}">${esc(hit)}</a>` : esc(hit); }
    last = m.index + hit.length;
  }
  return out + esc(text.slice(last));
}
function groupRules(rules){
  const order=["skip","classification","work_order_matching","task_linking","deduplication","routing","governance","tagging","notification"];
  const g=new Map(); rules.forEach(r=>{ if(!g.has(r.rule_type)) g.set(r.rule_type,[]); g.get(r.rule_type).push(r); });
  return [...g.entries()].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).map(([type,rs])=>`<div style="margin-top:8px"><div class="type mono" style="text-transform:uppercase;letter-spacing:.05em;font-size:10px;padding:4px 0">${esc(type.replace(/_/g," "))} · ${rs.length}</div>${rs.map(r=>`<div class="rule ${r.is_active?"":"off"}"><div class="t"><span class="mono muted" style="font-size:11px">${r.priority}</span>${esc(r.name)}${r.is_active?"":`<span class="pill st-cancelled">off</span>`}</div><div class="d">${esc(r.description||"")}</div><details><summary>conditions / actions</summary><pre class="json">${esc(JSON.stringify(r.conditions,null,1))}\n→ ${esc(JSON.stringify(r.actions,null,1))}</pre></details></div>`).join("")}</div>`).join("");
}

/* Is the copy in this browser still the published one? Fetch the deployed page, read its BUILD
   string, and offer a reload when it differs. Fails quietly when the page is opened from disk. */
async function watchForUpdate(){
  const check = async () => {
    try{
      const r = await fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
      if(m && m[1] !== BUILD) $("#updateBtn").hidden = false;
    }catch{ /* file:// or offline — nothing to do */ }
  };
  setTimeout(check, 60000);
  setInterval(check, 300000);
}

$("#refreshBtn").addEventListener("click", async ()=>{ await loadCore(true); render(); });
$("#buildTag").textContent = BUILD;
$("#updateBtn").addEventListener("click", ()=>location.reload());
watchForUpdate();
/* Boot: recover-link → ArcGIS return → sign-in gate → who am I → tabs → data. */
async function boot(){
  captureRecoveryHash();
  await agolFinishSignIn();                       // ArcGIS return trip is independent of the EOS session
  if(UI.auth.mode==="setpw" && SESSION){ renderAuth(); return; }
  if(!SESSION){ UI.auth.mode="signin"; renderAuth(); return; }
  await loadMe();
  if(!ME){ UI.auth.mode="noaccess"; renderAuth(); return; }
  UI.auth.mode="signin"; UI.auth.msg=""; applyTabs();
  touchPresence();
  route=parseHash(); await loadCore(); render();
}
/* "Last seen" in the Logins panel: stamp the person's row now and every hour the tab stays open. */
let _touchTimer=null;
function touchPresence(){ rpc("eos_touch",{}).catch(()=>{}); if(!_touchTimer) _touchTimer=setInterval(()=>{ if(SESSION && !document.hidden) rpc("eos_touch",{}).catch(()=>{}); }, 3600e3); }
authLoad();
boot();
