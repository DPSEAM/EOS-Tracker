<style>
/* ═══════════════════════════════════════════════════════════════
   DPS Tracker — City of Beverly, Department of Public Services
   Read-only. Every page reads live from Supabase views.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* v112: warm stone canvas + off-white cards (was cool gray + pure white). Beverly civic (v73): navy sidebar with a gold active marker, cool gray canvas, white cards, teal accent, Inter. */
  --bg:#E7E4DD; --panel:#FAF8F4; --panel-2:#F2EFE9; --line:#D9D4CA; --line-2:#E7E2D9;
  --ink:#111827; --ink-2:#4B5563; --ink-3:#8A919C; --ink-4:#B8BDC5;
  --accent:#1F6F78; --accent-ink:#FFFFFF; --accent-soft:#E6F2F3; --accent-line:#B7D8DB;
  --rail:#14284B; --rail-ink:#C3CCDC; --rail-active:rgba(201,162,39,.16); --rail-gold:#F2D675;
  --chip:#EFEBE4;
  /* semantic — separate from accent */
  --s-pending:#6B7280; --s-pending-bg:#ECE9E3;
  --s-progress:#1F6F78; --s-progress-bg:#E3F0F1;
  --s-blocked:#C2362B; --s-blocked-bg:#FCEBE9;
  --s-done:#23804A; --s-done-bg:#E6F4EC;
  --s-cancel:#8A919C; --s-cancel-bg:#ECE9E3;
  --p-urgent:#D93A2F; --p-high:#E8811F; --p-medium:#D9A70B; --p-low:#B0B6BF;
  --warn:#B06A00; --warn-bg:#FFF6E5;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --row-hover:#F1EEE8; --row-sel:#E2EEEE; --wash:231,228,221;
  --bar-bg:#E2EAE8; --bar-line:#CCD9D6; --tbl-bg:var(--bg);
  --g-plan:#2F64B0; --g-plan-bg:#EAF1FB;
  --r:8px; --rail-w:60px; --detail-w:460px;
  --shadow:0 1px 2px rgba(60,48,30,.06),0 1px 3px rgba(60,48,30,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:var(--sans);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;letter-spacing:-.003em;color:var(--ink);background:var(--bg);line-height:1.5;min-height:100vh;display:grid;grid-template-columns:var(--rail-w) 1fr;padding-inline:0}
a{color:var(--accent)}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* ── rail (v111): a slim light icon strip. Labels appear on hover/focus; your account, last ingest,
   Refresh, view-as and the build live in the menu under your initials at the bottom. ── */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:0;height:100vh;z-index:40}
.rail .brand{padding:0 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line-2);display:flex;justify-content:center;width:100%}
.rail .brand .seal{width:36px;height:36px;border-radius:50%;background:#fff;padding:1px;box-shadow:0 0 0 1px var(--accent-line)}
.rail .brand div{display:none}
.rail a.nav{position:relative;display:flex;align-items:center;justify-content:center;width:42px;height:40px;border-radius:9px;color:var(--ink-3);text-decoration:none}
.rail a.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail a.nav:hover,.rail a.nav:focus-visible{background:var(--panel-2);color:var(--ink);outline:none}
.rail a.nav.active{background:var(--accent-soft);color:var(--accent)}
.rail a.nav.active::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail a.nav .lbl{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#1d2b3a;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.rail a.nav:hover .lbl,.rail a.nav:focus-visible .lbl{opacity:1}
.rail a.nav .cnt{display:none}
.rail a.nav .cnt.show{display:block;position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.rail a.nav .cnt.show.bad{background:var(--s-blocked,#c0392b)}
.rail .me{margin-top:auto;position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);font:600 12px/1 var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rail .me:hover,.rail .me[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.rail:has(#updateBtn:not([hidden])) .me::after,.rail:has(#deployFlag:not([hidden])) .me::after,.rail.ingest-bad .me::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#d97706;box-shadow:0 0 0 2px var(--panel)}
.rail .foot{position:absolute;left:calc(100% + 8px);bottom:10px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,30,50,.18);padding:12px 14px;font-size:11.5px;color:var(--ink-2);line-height:1.55}
.rail .foot[hidden]{display:none}
.rail .foot b{color:var(--ink);font-weight:600}
.rail button.refresh{width:100%;margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--ink-2);padding:6px;border-radius:7px;cursor:pointer;font:inherit;font-weight:500}
.rail button.refresh:hover{border-color:var(--accent);color:var(--accent)}
.rail button.refresh:disabled{opacity:.5;cursor:default}
#viewAs{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}

/* ── page shell ── */
.page{display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--bar-bg);border-bottom:1px solid var(--bar-line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.bar h1{font-size:16px;font-weight:650;letter-spacing:-.015em;margin-right:6px}
.bar .grow{flex:1}
.bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);min-width:220px;background:var(--panel)}
.bar select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.bar .seg,.pv .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bar .seg button,.pv .seg button{background:var(--panel);border:0;padding:6px 10px;cursor:pointer;color:var(--ink-2);font-size:12px;border-right:1px solid var(--line)}
.bar .seg button:last-child,.pv .seg button:last-child{border-right:0}
.bar .seg button.on,.pv .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .18s ease;min-height:0}
.body.open{grid-template-columns:minmax(0,1fr) var(--detail-w)}
.content{padding:20px 24px 48px;min-width:0}

/* ── stat tiles ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s}
.tile:hover{border-color:var(--accent-line)}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:11px;color:var(--ink-3)}
.tile.crit b{color:var(--s-blocked)}
/* v103 status tiles: coloured edge per status; switched-off tiles fade */
.tile.stt{border-left:4px solid var(--g,var(--line));opacity:.55}.tile.stt.on{opacity:1}.tile.stt b{color:var(--g,var(--ink))}
.tile.tst-in_progress{--g:var(--s-progress)}.tile.tst-pending{--g:var(--g-plan)}.tile.tst-completed{--g:var(--s-done)}.tile.tst-cancelled{--g:var(--s-cancel)}
.tile.stt.on{border-color:var(--g);border-left-width:4px;box-shadow:inset 0 0 0 1px var(--g)}
.tile.warn b{color:var(--p-high)}

/* ── tables ── */
.tbl{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;overflow:hidden;box-shadow:none} /* v113: rows sit on the canvas, no white box */
.tbl .scroll{overflow-x:auto}
.scroll.capped{max-height:320px;overflow-y:auto;border:1px solid var(--line-2);border-radius:6px}
.scroll.capped thead th{z-index:1}
.acts .ext{display:inline-flex;gap:8px;margin-left:6px;font-size:11px}.acts .ext a{border:0;padding:0;background:none;color:var(--ink-3);text-decoration:none}.acts .ext a:hover{color:var(--accent);text-decoration:underline}
.pv{margin-top:8px}.pv .seg{margin-bottom:8px}.pv iframe{width:100%;height:560px;border:1px solid var(--line-2);border-radius:6px;background:#fff}.pv pre.txt{white-space:pre-wrap;font:12px/1.5 var(--mono,ui-monospace,monospace);max-height:460px;overflow:auto;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:10px;margin:0}
.setval{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.setval details summary{cursor:pointer;color:var(--accent)}
.setval details pre{white-space:pre-wrap;font-size:10.5px;max-height:220px;overflow:auto;margin:4px 0 0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
.body.open .content table{min-width:640px} /* scroll sideways rather than crush the name column */
thead th{position:sticky;top:0;background:var(--tbl-bg);font-size:11px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th .arr{opacity:.5;font-size:10px;margin-left:3px}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:12.5px}
/* no zebra striping — hairlines + hover only */
tbody tr:last-child td{border-bottom:0}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:var(--row-hover)}
tbody tr.r.sel td,tbody tr.r.sel:nth-child(even) td{background:var(--row-sel)}
td .t{font-weight:500}
td .d{color:var(--ink-3);font-size:11.5px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody td a{text-decoration:none}tbody td a:hover{text-decoration:underline}

/* ── detail panel ── */
.detail{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;height:calc(100vh - 49px);position:sticky;top:49px;min-width:0}

.dh.tint-done{background:#F3FAF6;--tint-edge:var(--s-done)} .dh.tint-planned{background:var(--panel-2);--tint-edge:var(--ink-4)} .dh.tint-cancel{background:#EFECE6;--tint-edge:var(--s-cancel)}

.btn-update{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:6px 14px;box-shadow:0 1px 2px rgba(31,111,120,.25);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}

.sec.upd{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.sec.upd .mono{color:var(--ink-2)}
@media print{ .btn-update,.sec.upd{display:none} }
/* ── Dashboards (v82): one card per ArcGIS Online dashboard the viewer is allowed to see ── */
.dash-wrap{padding:18px 20px;max-width:1180px}
.dash-note{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;max-width:80ch}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dash-card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 12px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
.dash-card:hover{border-color:var(--accent-line);border-left-color:var(--accent)}

.dash-card .dgo{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);padding-top:9px;font-size:12px}
.dash-card .dgo b{color:var(--accent);font-weight:600}
.dash-card .dgo span{color:var(--ink-3);font-size:11px}
.dnotes{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.dn{background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent-line);border-radius:6px;padding:7px 10px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.dn .dl{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.dn .dv{white-space:normal;overflow-wrap:anywhere}
.dn .dv>div+div{margin-top:3px}.dn .dv ol{margin:2px 0 0;padding-left:20px}.dn .dv li+li{margin-top:2px}.dn .dv b{font-weight:600;color:var(--ink-2)}
.dn-waiting-on{border-left-color:var(--s-blocked,#c2410c)}.dn-next-steps{border-left-color:var(--accent)}
.dn-tags{display:flex;flex-wrap:wrap;gap:5px;background:none;border:0;padding:2px 0}
.dtag{font-size:11px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.dh .instr{font-size:12.5px;color:var(--ink-2);margin:4px 0 2px;line-height:1.4}
.wo-dash{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line-2);font-size:12.5px}

.wo-dash a{font-weight:600;text-decoration:none}
.detail .db{padding:4px 20px 32px}
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin:14px 0 4px}
.glance .gl{background:var(--panel);padding:9px 12px;min-width:0}
.glance .gl:last-child:nth-child(odd){grid-column:1/-1}
.glance .gl>span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.glance .gl b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.glance .gl b a{text-decoration:none}.glance .gl b a:hover{text-decoration:underline}
.glance .gl.bad b{color:var(--s-blocked)} .glance .od{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
.sec.rev .why{margin-top:6px;padding:9px 12px;background:var(--warn-bg);border-radius:7px;font-size:12.5px}.sec.rev .acts{margin-top:8px;font-size:12.5px}
.dpart+.dpart{margin-top:12px}.dpart>span{font-size:11px;font-weight:600;color:var(--ink-2)}.dpart .desc{margin-top:2px!important}
.tl{list-style:none;position:relative;margin:2px 0 0;padding:0}
.tl::before{content:"";position:absolute;left:11.5px;top:10px;bottom:10px;width:1px;background:var(--line)}

.ev-ic svg{width:12px;height:12px}

.tle.k-review .ev-ic{color:var(--warn);border-color:#F2D9A6;background:var(--warn-bg)}
.tle.k-resolved .ev-ic,.tle.k-done .ev-ic{color:var(--s-done);border-color:#BFE3CC;background:var(--s-done-bg)}
.tle.k-correct .ev-ic{color:#7C3AED;border-color:#DDD0FB;background:#F5F0FF}
.tle.k-merge .ev-ic,.tle.k-split .ev-ic{color:#0E7490;border-color:#BCE3EC;background:#EDF8FB}

.ev-b{min-width:0;flex:1;padding-top:2px}
.ev-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev-h b{font-size:12px;font-weight:600;color:var(--ink-2)}.ev-h span{font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev-t{font-size:13px;line-height:1.55;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev-m{font-size:11px;color:var(--ink-3);margin-top:3px;overflow-wrap:anywhere}.ev-m a{color:var(--ink-3)}.ev-m .tref{color:var(--accent);cursor:pointer}
.tl-more>summary{cursor:pointer;font-size:12px;color:var(--ink-3);padding:4px 0 6px 33px;list-style:none}.tl-more>summary::-webkit-details-marker{display:none}.tl-more>summary:hover{color:var(--accent)}
.tl-tog{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);display:flex;gap:5px;align-items:center;cursor:pointer;font-family:var(--sans)}
.sec{padding:16px 0;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec h4>span{font-weight:500;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:118px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}.kv dd{min-width:0;overflow-wrap:anywhere}
.kv dd a{text-decoration:none}
.steps{padding-left:18px}.steps li{margin-bottom:4px}
.note{padding:8px 0;border-top:1px dashed var(--line-2);font-size:12.5px}
.nday{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:10px 0 2px;border-top:1px solid var(--line-2);margin-top:4px}
.nday:first-child{border-top:0;margin-top:0;padding-top:2px}
.nday+.note{border-top:0}
.note:first-of-type{border-top:0;padding-top:0}
.note .m{font-size:11px;color:var(--ink-3);margin-top:3px}
/* Newest update, shown in full at the top; everything older folds under it. */
.upd-latest{padding:10px 12px;background:var(--chip);border-left:3px solid var(--accent);border-radius:0 5px 5px 0;font-size:13px;line-height:1.55}
.upd-latest .m{font-size:11px;color:var(--ink-3);margin-top:5px}
.upd-hist{margin-top:10px}
.upd-hist>summary{cursor:pointer;font-size:11.5px;color:var(--ink-3);list-style:none;user-select:none;padding:3px 0}
.upd-hist>summary::-webkit-details-marker{display:none}
.upd-hist>summary::before{content:"▸ ";color:var(--ink-4)}
.upd-hist[open]>summary::before{content:"▾ "}
.upd-hist>summary:hover{color:var(--ink-2)}
.upd-body{max-height:320px;overflow:auto;margin-top:4px;padding-right:4px}
.note .tref{color:var(--accent);cursor:pointer}
.wo-summary{padding:12px 14px;background:var(--accent-soft);border-radius:var(--r);color:var(--ink);font-size:13px;line-height:1.6;white-space:pre-wrap}
.rv-group{margin-top:14px}
.rv-group>h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.rv-group>h3 span{background:var(--chip);border-radius:10px;padding:0 7px;font-size:11px;color:var(--ink-2)}
.rv.rv-deploy{border-left:3px solid var(--accent)}
.deploy-flag{margin-top:8px;padding:8px 10px;border-radius:7px;background:var(--warn-bg);color:var(--warn);border:1px solid #F0D9A8;font-size:11.5px;line-height:1.45}
.deploy-flag a{color:var(--warn);text-decoration:underline}
.doc{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line-2);font-size:12.5px}
.doc:first-of-type{border-top:0}
.doc .ico{font-family:var(--mono);font-size:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--ink-2);flex-shrink:0;margin-top:2px;text-transform:uppercase}
.doc .m{font-size:11px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--ink-2)}
.link-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line-2);font-size:12.5px;cursor:pointer}

.link-row:hover .t{color:var(--accent)}
.detail .desc{font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}

/* ── meetings calendar ── */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.cal-h h3{font-size:14px;font-weight:600;min-width:150px}
.cal-h button{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:12px}
.cal-h button:hover{border-color:var(--accent-line);color:var(--accent)}
.cal-h .grow{flex:1}
.cal-h .legend{font-size:11px;color:var(--ink-3);display:flex;gap:12px}
.cal-h .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.cal-dow div{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:5px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,auto)}
.cal-day{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 6px;min-width:0;display:flex;flex-direction:column;gap:3px}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--panel-2);color:var(--ink-4)}
.cal-day.past .num{color:var(--ink-4)}
.cal-day.today{background:var(--accent-soft)}
.cal-day .num{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}

.cal-day .num small{font-size:10px;color:var(--ink-4)}
.ev{display:block;font-size:11px;line-height:1.3;padding:2px 6px;border-radius:3px;border-left:3px solid var(--accent);background:var(--panel-2);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.ev .tm{font-family:var(--mono);color:var(--ink-3);font-size:10px;margin-right:4px}
.ev:hover{background:var(--accent-soft)}
.ev.sel{background:var(--accent);color:#fff;border-left-color:var(--accent)}
.ev.sel .tm{color:rgba(255,255,255,.75)}
.ev.past{border-left-color:var(--ink-4);color:var(--ink-3)}
.ev.held{border-left-color:var(--s-done)}
.ev.cancelled{border-left-color:var(--s-cancel);text-decoration:line-through;color:var(--ink-4)}
.ev.more{border-left-color:transparent;background:none;color:var(--ink-3);font-size:10.5px;padding-left:9px;text-align:left}
.ev.task{border-left-style:solid}.ev.task.p-imp{border-left-color:var(--s-blocked)}.ev.task.p-high{border-left-color:#e07b00}.ev.task.p-med{border-left-color:var(--s-progress)}.ev.task.p-low{border-left-color:var(--ink-4)}
.ev.task.over{color:var(--s-blocked);font-weight:600}
.ev.wo{border-left-color:var(--ink-3);background:none;color:var(--ink-2);font-style:italic}
.cal.week .cal-grid{grid-auto-rows:minmax(260px,auto)}.cal-day.wk .num b{font-weight:600}
.cal-h .legend label{display:inline-flex;align-items:center;gap:3px;cursor:pointer}.cal-h .legend input{margin:0 2px 0 0}
.cal-h .seg button{font-size:11px;padding:2px 8px}
@media(max-width:820px){.cal-grid{grid-auto-rows:minmax(64px,auto)}.ev{font-size:10px}.ev .tm{display:none}}

/* ── system page ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hdots{display:inline-flex;gap:3px;align-items:center}.hdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink-4)}.hdot.pass{background:#3E9A5C}.hdot.s1{background:#C9A227}.hdot.s2{background:#E07B00}.hdot.s3{background:var(--s-blocked)}
.htrend{display:inline-flex;gap:2px;align-items:flex-end;margin-left:6px}.hbar{width:5px;height:12px;border-radius:2px;display:inline-block;background:#3E9A5C;opacity:.85}.hbar.s1{background:#C9A227}.hbar.s2{background:#E07B00}.hbar.s3{background:var(--s-blocked)}
tr.hfail td{background:#FFF8F5}
/* Home */
.home-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}.home-hd h2{margin:0;font-size:20px}.home-hd .muted{font-size:13px}
.home{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:1100px){ .home.side{grid-template-columns:minmax(0,3fr) minmax(0,2fr)} }
/* Home lists (v99). Open tasks: colour-coded groups — In Progress (teal), Planned (blue), Other (grey) —
   with a matching left edge and status mark on every row. Completed: green check, grouped by recency. */
.home .card{--g:var(--s-pending);--gbg:var(--s-pending-bg)}
.hgrp{display:flex;align-items:center;gap:7px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g);background:var(--gbg);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:1}
.hgrp .n{margin-left:auto;font-weight:600;font-size:11px;background:var(--panel);color:var(--g);border:1px solid currentColor;border-radius:999px;padding:0 7px;letter-spacing:0}
.g-prog{--g:var(--s-progress);--gbg:var(--s-progress-bg)}
.g-plan{--g:var(--g-plan);--gbg:var(--g-plan-bg)}
.g-other{--g:var(--s-pending);--gbg:var(--s-pending-bg)}
.g-done{--g:var(--s-done);--gbg:var(--s-done-bg)}
.hrow{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 11px;border-bottom:1px solid var(--line-2);border-left:3px solid var(--g);cursor:pointer;background:var(--panel)}
.hrow:hover{background:var(--panel-2)}.hrow.sel{background:var(--accent-soft)}
.hrow .mk{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;line-height:1;color:#fff}
.g-prog .mk{border:2px solid var(--g);background:conic-gradient(var(--g) 0 50%,transparent 50% 100%)}
.g-plan .mk,.g-other .mk{border:2px solid var(--g);background:var(--panel)}
.g-done .mk{background:var(--g);font-weight:700}
.hrow .hm{flex:1;min-width:0}.hrow .ht{font-size:13px;font-weight:500;line-height:1.3;color:var(--ink)}
.g-done .hrow .ht{color:var(--ink-2)}
.hrow .hs{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hs .id{font-family:var(--mono,ui-monospace,monospace);font-size:10.5px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-right:2px}
.hrow .hs a{color:inherit}
.hrow .hr{flex:none;text-align:right;font-size:11px;white-space:nowrap}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;border:1px solid transparent}
.chip.due{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}
.chip.soon{background:var(--warn-bg,#FFF4E5);color:var(--warn,#B45309)}
.chip.od{background:var(--s-blocked);color:#fff}
.chip.done{background:var(--s-done-bg);color:var(--s-done)}
.hrow .by{display:block;margin-top:2px;color:var(--ink-3);font-size:10.5px;font-weight:400}
.hlist{max-height:calc(100vh - 230px);overflow:auto}
.hsearch{position:relative;flex:1;max-width:520px;min-width:220px}
.hsearch input{width:100%;box-sizing:border-box;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);font-size:13px}
.hsearch input:focus{background:var(--panel);outline:2px solid var(--accent-line);border-color:var(--accent)}
.hs-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh;overflow:auto;z-index:30}
.hs-g{display:flex;gap:6px;align-items:center;padding:6px 12px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2);border-top:1px solid var(--line-2)}
.hs-g:first-child{border-top:0}.hs-g span{font-weight:400}.hs-g a{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.hs-r{padding:7px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px}.hs-r b{font-size:13px;font-weight:500;color:var(--ink)}.hs-r small{font-size:11px;color:var(--ink-3)}
.hs-r:hover,.hs-r.on{background:var(--accent-soft)}
.hs-none{padding:10px 12px;font-size:12.5px;color:var(--ink-3)}
@media print{ .hsearch{display:none} }

body[data-page="home"] .content:has(.chat.on){background-image:linear-gradient(rgba(var(--wash),.86),rgba(var(--wash),.86)),var(--hbg)}
@media print{ body[data-page="home"] .content{background:none!important} }
/* ── Home + chat (v106): greeting and chat box centred above the task cards ── */
.home-chat{max-width:780px;margin:6px auto 22px;text-align:center}
.home-chat .home-hd{display:block;margin-bottom:12px}.home-chat .home-hd h2{font-size:22px;margin:0 0 2px}
.home-chat .cstart{margin-top:12px}
.tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* ── Projects (v115) ── */
.pbar{display:inline-block;vertical-align:middle;width:64px;height:7px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--s-done)}
.pnum{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kindtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#2F64B0;background:#EAF1FB;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.phase{display:inline-block;font-size:10.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:4px}
.badges .phase{margin-left:6px}
.mst{list-style:none;margin:0;padding:0 0 0 4px;border-left:2px solid var(--line-2)}
.mst li{display:flex;gap:10px;align-items:flex-start;padding:4px 0 8px 12px;position:relative}
.mst li .dot{position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.mst li.done .dot{background:var(--s-done);border-color:var(--s-done)}.mst li.late .dot{border-color:var(--s-blocked)}
.mst li b{display:block;font-size:13px;font-weight:600}.mst li small{font-size:11.5px;color:var(--ink-3)}.mst li.late small{color:var(--s-blocked);font-weight:600}
.mst li.done b{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-bottom:8px}
.kv span{display:block;font-size:11px;color:var(--ink-3)}.kv b{font-size:13px;font-weight:600}
.tile.tst-on_hold{--g:#B45309}
/* ── Chat (v105) ── */
.chat{max-width:860px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.chat-hero{margin:auto 0;padding:40px 0 60px;text-align:center}
.chat-hero h2{font-size:24px;font-weight:600;margin:0 0 6px}.chat-hero p{margin:0 0 20px;font-size:13px}
.cbox{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);text-align:left}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:14px;line-height:1.45;background:transparent;color:var(--ink);padding:6px 0;max-height:180px}
.cbox button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;cursor:pointer}
.cbox button:disabled{opacity:.4;cursor:default}
.cstart{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.cstart button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.cstart button:hover{border-color:var(--accent);color:var(--accent)}
.chat.on .cmsgs{flex:1;overflow:auto;padding:8px 2px 16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 210px)}
.chat.on .cbox{position:sticky;bottom:12px}
.cm{display:flex}.cm.me{justify-content:flex-end}
.cm-b{max-width:78%;font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:14px}
.cm.me .cm-b{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.cm.ai .cm-b{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:92%}
.cm-b.md p{margin:0 0 6px}.cm-b.md p:last-child{margin-bottom:0}.cm-b.md ul,.cm-b.md ol{margin:4px 0 8px;padding-left:20px}.cm-b.md h4{margin:8px 0 4px;font-size:13.5px}
.cm-b.md code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:0 4px;border-radius:3px}
.cm-tbl{overflow-x:auto;margin:6px 0}.cm-tbl table{border-collapse:collapse;font-size:12.5px}.cm-tbl th,.cm-tbl td{border:1px solid var(--line-2);padding:4px 8px;text-align:left}.cm-tbl th{background:var(--panel-2)}
.typing{color:var(--ink-3);font-size:12.5px}.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:3px;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s;margin-right:8px}
@keyframes tdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cm-err{align-self:center;max-width:90%;margin:10px auto 0;background:var(--warn-bg,#FFF4E5);color:var(--warn,#B45309);border:1px solid currentColor;border-radius:8px;padding:8px 12px;font-size:12.5px}
@media print{ .cbox,.cstart{display:none} }
/* ── Home ticker (v96): weather, today's meetings, work underway. Pauses on hover; static for reduced motion. */
.ticker{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;height:34px;display:flex;align-items:center}
.ticker .tk-lab{flex:none;height:100%;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);z-index:1}
.ticker .tk-view{flex:1;overflow:hidden;height:100%;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker .tk-track{display:inline-flex;gap:0;height:100%;align-items:center;white-space:nowrap;animation:tk-scroll var(--tk-dur,60s) linear infinite;will-change:transform}
.ticker:hover .tk-track,.ticker:focus-within .tk-track{animation-play-state:paused}
.ticker .tk-i{font-size:12.5px;color:var(--ink);padding:0 22px;border-right:1px solid var(--line-2);text-decoration:none}
.ticker .tk-i b{color:var(--accent);font-weight:600;margin-right:6px}
.ticker .tk-i .tk-by{color:var(--ink-2);margin:0 6px 0 -2px}
.ticker a.tk-i:hover{color:var(--accent)}
@keyframes tk-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){ .ticker .tk-track{animation:none} .ticker .tk-view{overflow-x:auto} }
@media print{ .ticker{display:none} }
.home .card .ch h3{margin:0;font-size:14px}.home .card .ch .muted{font-size:12px}
.home .card.closed .cb{display:none}.home .card .ch{cursor:pointer;user-select:none}.home .card .ch .chev{display:inline-block;margin-right:6px;transition:transform .15s}.home .card.closed .ch .chev{transform:rotate(-90deg)}
.home table td .t{font-weight:500}
.card .ch{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;justify-content:space-between}
.card .ch h3{font-size:13px;font-weight:600}
.card .ch .muted{font-size:11px}
.card .cb{padding:6px 14px 10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:56px;padding:6px 0 0}
.bars i{flex:1;background:var(--accent-line);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bars i.f{background:var(--s-blocked)}
.bars i:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:3}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-4);padding-top:3px}
.gap{padding:10px 0;border-top:1px solid var(--line-2)}
.gap:first-child{border-top:0}
.gap .t{font-weight:600}
.gap .sug{margin-top:4px;font-size:12px;color:var(--ink-2)}
.gap .sug b{color:var(--ink);font-weight:500}
.gap .m{font-size:11px;color:var(--ink-3);margin-top:3px}
pre.json{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2);margin-top:4px}

.rule:first-child{border-top:0}
.rule .t{font-weight:500;display:flex;gap:8px;align-items:center}
.rule .t .type{font-family:var(--mono);text-transform:none;background:var(--panel-2);padding:0 5px;border-radius:3px}

.rule.off{opacity:.55}
details summary{cursor:pointer;font-size:11px;color:var(--accent);margin-top:4px}

/* ── documents ── */
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts button,.acts a{font:inherit;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap}
.acts button:hover,.acts a:hover{border-color:var(--accent-line);background:var(--accent-soft)}

/* ── states ── */
.loading{padding:30px;text-align:center;color:var(--ink-3)}
.err{background:var(--s-blocked-bg);color:var(--s-blocked);padding:10px 14px;border-radius:var(--r);margin-bottom:12px;font-size:12.5px}

body.auth .page{grid-column:1/-1}body.auth .content{padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.authwrap{width:100%;display:flex;justify-content:center;padding:24px}
.authcard{background:var(--panel);border-radius:12px;padding:28px 30px 22px;width:min(400px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}

.authcard h2{margin:0 0 6px;font-size:18px}.authcard p{margin:0 0 12px;font-size:13px}
.authcard label{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 4px}

.rail a.nav[hidden]{display:none}
body.previewing .page{grid-template-rows:auto auto 1fr}

@media print{
  body{grid-template-columns:1fr;background:#fff}
  .rail,.bar,.tiles{display:none!important}
  .body{grid-template-columns:1fr!important}.detail{display:none!important}
  /* printing a meeting prints the agenda, not the list */
  body[data-page="meetings"] .body.open .content{display:none}
  body[data-page="meetings"] .body.open .detail{display:block!important;position:static;height:auto;border:0;max-width:7.5in}
  body[data-page="meetings"] .detail .dh button{display:none}
  .content{padding:0}.tbl{border:0}
  thead th{position:static}
  .pill,.prio i,.flag,tbody tr:nth-child(even) td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:820px){
  body{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px}
  .rail .brand{border:0;margin:0 4px 0 0;padding:0;width:auto}.rail .brand .seal{width:30px;height:30px}
  .rail a.nav .lbl{display:none}.rail a.nav.active::before{left:9px;right:9px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .rail .me{margin:0 0 0 auto}.rail .foot{left:auto;right:8px;top:calc(100% + 6px);bottom:auto}
  .body.open{grid-template-columns:1fr}
  .detail{position:fixed;inset:0;height:100vh;z-index:20;border:0}
}
/* ── Auto-hide rail (v112): on desktop with a mouse the rail slides away (page widens to fill)
   after ~3 s untouched; touching the far-left edge brings it back. Phones/touch keep the fixed bar. ── */
#railEdge{display:none}
@media (hover:hover) and (min-width:821px){
  body.rail-auto{grid-template-columns:1fr;padding-left:var(--rail-w);transition:padding-left .22s ease}
  body.rail-auto.rail-off{padding-left:0}
  body.rail-auto .rail{position:fixed;left:0;top:0;bottom:0;height:100vh;transition:transform .22s ease,box-shadow .22s ease;box-shadow:none}
  body.rail-auto.rail-off .rail{transform:translateX(calc(-100% - 2px));box-shadow:none}
  body.rail-auto #railEdge{display:block;position:fixed;left:0;top:0;bottom:0;width:10px;z-index:39}
  body.rail-auto #railEdge::after{content:"";position:absolute;left:2px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:3px;background:var(--accent);opacity:0;transition:opacity .2s}
  body.rail-auto.rail-off #railEdge::after{opacity:.35}
  body.rail-auto.rail-off #railEdge:hover::after{opacity:.8}
}
@media print{ #railEdge{display:none!important} }

/* ── v113 dark theme: navy-charcoal, same teal accent (brightened for contrast) ── */

  --bg:#111823; --panel:#18212E; --panel-2:#1F2937; --line:#2B3646; --line-2:#232E3D;
  --ink:#E6EAF0; --ink-2:#B7C0CC; --ink-3:#8B95A5; --ink-4:#5B6676;
  --accent:#4DB2BC; --accent-ink:#0B1A1C; --accent-soft:rgba(77,178,188,.15); --accent-line:rgba(77,178,188,.38);

  --s-done:#5BC488; --s-done-bg:rgba(91,196,136,.14);
  --s-cancel:#7F8998; --s-cancel-bg:rgba(127,137,152,.14);
  --warn:#E8A23C; --warn-bg:rgba(232,162,60,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.25);
  --row-hover:rgba(255,255,255,.04); --row-sel:rgba(77,178,188,.16); --wash:17,24,35;
  --bar-bg:#152430; --bar-line:#24394A;

.doc-legend .dl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 4px}
.doc-legend .dl-h b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.doc-legend .dl-h a{font-size:11px}
.dl-r{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:3px 4px;border-radius:6px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.dl-r:hover{background:var(--panel-2)}.dl-r.off{opacity:.4}
.dl-sw{width:11px;height:11px;border-radius:50%;flex:0 0 11px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.12)}
.dl-n{flex:1}.dl-c{color:var(--ink-3);font-variant-numeric:tabular-nums}
.dcat{display:inline-block;font-size:10.5px;font-weight:600;padding:0 7px;border-radius:999px;margin-right:6px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel))}
.doc-pin{background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex!important;align-items:center;justify-content:center;font:600 11px/1 var(--mono)}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:12.5px;line-height:1.5}
.leaflet-popup-content a{color:var(--accent)}
.pp .leaflet-popup-content-wrapper{border-radius:10px;padding:0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pp .leaflet-popup-content{margin:0;width:auto!important}
.pp-card{padding:12px 14px 10px;min-width:250px}
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.pp-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px 2px 6px}
.pp-class{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.pp-title{margin:2px 0 8px;font-size:15px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.pp-facts{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:3px 12px;margin:0;font-size:12px;max-height:220px;overflow:auto}
.pp-facts dt{color:var(--ink-3);font-size:11px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-facts dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.pp-img{max-width:100%;max-height:120px;border-radius:6px;display:block}
.pp-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pp-photos img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2)}
.pp-acts{display:flex;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-2);font-size:11.5px;white-space:nowrap}
.pp-acts a{text-decoration:none;font-weight:600}.pp-acts a:hover{text-decoration:underline}
.flag.noloc{background:var(--warn-bg);color:var(--warn)}
.flag.lostloc{background:var(--s-blocked-bg,#FDECEC);color:var(--s-blocked)}
.placechip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;font-weight:500}
.placechip button{background:none;border:0;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 4px}
@media print{ .docmap,#docMapWrap{display:none!important} }

let HLQ = [];
function setHL(q){
  HLQ = [...new Set(String(q||"").toLowerCase().split(/\s+/).filter(t=>t.length>1))]
          .sort((a,b)=>b.length-a.length);
}
function hl(v){
  const t = esc(v==null?"":String(v));
  if(!HLQ.length) return t;
  const re = new RegExp("("+HLQ.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");

/* Details text (tasks.notes, work_orders.notes/scope) is one text field written as labelled lines
   ("Next steps: …", "Waiting on: …") and paragraphs. Each label or paragraph becomes its own block;
   lines under a label (numbered steps) stay with it; "Tags:" become chips. Display only — the text is unchanged. */
const DETAIL_SECTIONS = ["Requested by","Context","Next steps","Waiting on","Key details","Notes","Tags"];
const WO_DETAIL_SECTIONS = ["Scope","Funding & contract","Milestones","Waiting on","Key details","Notes","Tags"];
function detailsHTML(text, SECTIONS=DETAIL_SECTIONS, opts={}){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  const STD=new RegExp("^("+SECTIONS.join("|")+"):\\s*(.*)$");
  const std = lines.some(l=>STD.test(l.trim()));
  const LABEL=/^([A-Z][A-Za-z/&' -]{1,28}):\s*(.*)$/;
  const blocks=[]; let cur=null;
  for(const raw of lines){ const ln=raw.trim();
    if(!ln){ if(!std) cur=null; continue; }
    const m = std ? ln.match(STD) : ln.match(LABEL);
    if(m){ cur={label:m[1], lines:m[2]?[m[2]]:[]}; blocks.push(cur); continue; }
    if(!cur){ cur={label:null, lines:[]}; blocks.push(cur); }
    cur.lines.push(ln);
  }
  if(!blocks.length) return "";
  if(std){ const rank=l=>{ const i=SECTIONS.indexOf(l); return i<0?-1:i; }; blocks.sort((x,y)=>rank(x.label)-rank(y.label)); }
  // a line inside a section that starts with its own label ("Reported by: …") shows that label in bold
  const line = l => { const m=std && l.match(LABEL); return m ? `<b>${esc(m[1])}:</b> ${esc(m[2])}` : esc(l); };
  const body = b => {
    const num=b.lines.filter(l=>/^\d+[.)]\s/.test(l));
    if(num.length>=2){ const lead=b.lines.filter(l=>!/^\d+[.)]\s/.test(l));
      return `${lead.map(l=>`<div>${line(l)}</div>`).join("")}<ol>${num.map(l=>`<li>${line(l.replace(/^\d+[.)]\s*/,""))}</li>`).join("")}</ol>`; }
    return b.lines.map(l=>`<div>${line(l)}</div>`).join("");
  };
  return `<div class="dnotes">${blocks.map(b=>{
    if(b.label && /^tags$/i.test(b.label) && opts.hideTags) return "";
    if(b.label && /^tags$/i.test(b.label)) return `<div class="dn dn-tags">${b.lines.join(",").split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="dtag">${esc(x)}</span>`).join("")}</div>`;
    const k=(b.label||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
    return `<div class="dn${k?` dn-${k}`:""}">${b.label?`<div class="dl">${esc(b.label)}</div>`:""}<div class="dv">${body(b)}</div></div>`; }).join("")}</div>`;
}

/* ═════════ AUTH ═════════
   Everyone signs in with a City email + password (Supabase Auth). The database decides what each
   person sees: people.visibility_level (0–6) → eos_level() → every v_* view filters rows and blanks
   gated columns (view_defs / field_visibility). The page only hides what it knows will be empty.
   Session lives in localStorage; the access token is sent as the Bearer on every read and refreshed
   before it expires. The publishable key alone can read nothing. */
const SEAL_SRC = document.querySelector(".rail .seal")?.src || "";
const AUTH_KEY = "eos_auth";
let SESSION = null;          // {access_token, refresh_token, expires_at, user:{id,email}}
let ME = null;               // v_me row: full_name, visibility_level, level_def …
let TABS = {};               // settings.tabs_by_level
let FV = {};                 // field_visibility: column → minimum level
const LEVEL = () => ME ? (ME.visibility_level ?? 0) : 0;
const canSee = col => !(FV[col] > LEVEL());
function authLoad(){ try{ SESSION = JSON.parse(localStorage.getItem(AUTH_KEY)||"null"); }catch{ SESSION = null; } }
function authSave(s){ SESSION = s; try{ s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); }catch{} }
async function authCall(method, path, body, bearer){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, { method, headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json", ...(bearer?{Authorization:`Bearer ${bearer}`}:{}) }, body: body===undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || `${r.status} ${r.statusText}`);
  return j;
}
const fromTokens = j => ({ access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + ((j.expires_in||3600)*1000), user:{ id:j.user&&j.user.id, email:j.user&&j.user.email } });
async function signIn(email, password){ authSave(fromTokens(await authCall("POST","token?grant_type=password",{email, password}))); }
async function authRefresh(){
  if(!SESSION || !SESSION.refresh_token) return false;
  try{ authSave(fromTokens(await authCall("POST","token?grant_type=refresh_token",{refresh_token:SESSION.refresh_token}))); return true; }
  catch{ authSave(null); return false; }
}
async function authToken(){ if(!SESSION) return null; if(Date.now() > SESSION.expires_at - 60000) await authRefresh(); return SESSION ? SESSION.access_token : null; }
async function signOut(){ try{ if(SESSION) await authCall("POST","logout",{},SESSION.access_token); }catch{} authSave(null); ME=null; location.hash=""; location.reload(); }
async function requestReset(email){ await authCall("POST", `recover?redirect_to=${encodeURIComponent(location.origin+location.pathname)}`, {email}); }
async function setPassword(password){ await authCall("PUT","user",{password}, await authToken()); }
/* The password-reset email lands back here with the session in the URL fragment. Capture it
   before the router sees it, and show the "choose a new password" card. */
function captureRecoveryHash(){
  const h = location.hash.replace(/^#/,"");
  if(!/(^|&)access_token=/.test(h)) return false;
  const p = new URLSearchParams(h);
  authSave({ access_token:p.get("access_token"), refresh_token:p.get("refresh_token"), expires_at: Date.now()+((+p.get("expires_in")||3600)*1000), user:{} });
  UI.auth.mode = p.get("type")==="recovery" ? "setpw" : "signin";
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}

/* Account menu under your initials (v111): opens on click, closes on outside click, Esc or navigation. */
function wireAccountMenu(){
  const btn=$("#meBtn"), menu=$("#acctMenu"); if(!btn||btn.dataset.wired) return; btn.dataset.wired="1";
  const set=open=>{ menu.hidden=!open; btn.setAttribute("aria-expanded", String(open)); };
  btn.addEventListener("click", e=>{ e.stopPropagation(); set(menu.hidden); });
  document.addEventListener("mousedown", e=>{ if(!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) set(false); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") set(false); });
  window.addEventListener("hashchange", ()=>set(false));
}
/* v112: auto-hide rail. Shown on load, hides ~3 s after the pointer leaves; stays while the account menu is open
   or something inside it has keyboard focus. Edge strip or Alt+R brings it back. */
function wireRailAutoHide(){
  const rail=document.querySelector(".rail"), edge=$("#railEdge"); if(!rail||!edge||rail.dataset.auto) return; rail.dataset.auto="1";
  const mq=matchMedia("(hover:hover) and (min-width:821px)"); let t=null;
  const busy=()=>!$("#acctMenu")?.hidden || !!rail.querySelector(":focus-visible");
  const show=()=>{ clearTimeout(t); document.body.classList.remove("rail-off"); };
  const later=(ms=3000)=>{ clearTimeout(t); if(!mq.matches) return; t=setTimeout(()=>{ if(rail.matches(":hover")||busy()){ later(1500); return; } document.body.classList.add("rail-off"); }, ms); };
  const mode=()=>{ document.body.classList.toggle("rail-auto", mq.matches); if(mq.matches) later(); else show(); };
  rail.addEventListener("mouseenter", show); rail.addEventListener("mouseleave", ()=>later(1200));
  rail.addEventListener("focusin", show); rail.addEventListener("focusout", ()=>later(1500));
  edge.addEventListener("mouseenter", ()=>{ show(); later(); });
  document.addEventListener("mousemove", e=>{ if(mq.matches && e.clientX<=2 && document.body.classList.contains("rail-off")){ show(); later(); } }, {passive:true});
  document.addEventListener("keydown", e=>{ if(e.altKey && (e.key==="r"||e.key==="R")){ e.preventDefault(); show(); rail.querySelector("a.nav.active, a.nav")?.focus(); } });
  document.body.addEventListener("transitionend", e=>{ if(e.target===document.body && e.propertyName==="padding-left") window.dispatchEvent(new Event("resize")); });
  mq.addEventListener?.("change", mode); mode();
}

async function rest(path, attempt=0){
  let r;
  const token = (await authToken()) || SUPABASE_KEY;
  try{ r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token}`}}); }
  catch(e){ if(attempt<2){ await new Promise(res=>setTimeout(res, 700*(attempt+1))); return rest(path, attempt+1); } throw new Error(`network · ${path.split("?")[0]}`); }
  if(r.status===401 && SESSION && attempt===0){ if(await authRefresh()) return rest(path, attempt+1); authSave(null); renderAuth(); throw new Error("signed out"); }
  if(r.status>=500 || r.status===429){ if(attempt<2){ await new Promise(res=>setTimeout(res, 700*(attempt+1))); return rest(path, attempt+1); } }
  if(!r.ok) throw new Error(`${r.status} ${r.statusText} · ${path.split("?")[0]}`);
  return r.json();
}
/* Writes go through guarded database functions only (level checked server-side). */
async function rpc(fn, args){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${(await authToken())||SUPABASE_KEY}`,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message || j.hint || j.details || `${r.status} ${r.statusText}`);
  return j;
}

  const grp = (g,cls,r,dc) => `<div class="${cls}"><div class="hgrp">${esc(g)}<span class="n">${r.length}</span></div>${r.map(t=>row(t,dc)).join("")}</div>`;
  const openBody = open.length ? `<div class="hlist">${groups.map(([g,c,r])=>grp(g,c,r,false)).join("")}</div>`
    : `<div class="empty"><h3>${!mine.length?"No tasks are assigned to you yet":"Nothing open"}</h3><p>${!mine.length?"Tasks appear here when you are listed as labor on them. Everything else is under <a href='#/tasks'>Tasks</a>.":"Every task you are labor on is complete."}</p></div>`;
  // completed tasks grouped by when: Today, This week, Earlier
  const doneAt = t => t.stop_date_actual ? dayOf(t.stop_date_actual) : new Date(t.last_modified||t.entry_date);
  const sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()), sow=new Date(sod); sow.setDate(sod.getDate()-((sod.getDay()+6)%7));
  const dGroups=[["Today",done.filter(t=>doneAt(t)>=sod)],["Earlier this week",done.filter(t=>doneAt(t)<sod&&doneAt(t)>=sow)],["Earlier",done.filter(t=>doneAt(t)<sow)]].filter(([,r])=>r.length);
  const doneBody = done.length ? `<div class="hlist">${dGroups.map(([g,r])=>grp(g,"g-done",r,true)).join("")}</div>` : `<div class="empty"><p>Nothing completed in the last ${days} days.</p></div>`;
  const card = (key,title,sub,body) => `<div class="card${ui.closed.has(key)?" closed":""}" data-hk="${key}"><div class="ch" role="button" tabindex="0" aria-expanded="${!ui.closed.has(key)}"><h3><span class="chev">▾</span>${title}</h3><span class="muted">${sub}</span></div><div class="cb" style="padding:0">${body}</div></div>`;
  $("#content").innerHTML = `<div class="home-root">${homeTickerShell()}<div class="home-chat"><div class="home-hd"><h2>${esc(greet)}${first?`, ${esc(first)}`:""}</h2><span class="muted">${esc(now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}))}${mine.length?` · ${open.length} open${overdue?` · <span style="color:var(--s-blocked);font-weight:600">${overdue} overdue</span>`:""}${week?` · ${week} due this week`:""}`:""}</span></div>
    ${chatBoxHTML(false)}${UI.chat.err?`<div class="cm-err">${esc(UI.chat.err)}</div>`:""}${chatStartersHTML()}</div>
    <div class="home${cfg.layout==="stacked"?"":" side"}">
    ${card("open","My open tasks",`${open.length} · in progress first`, openBody)}
    ${card("done","My completed tasks",`${done.length} in the last ${days} days`, doneBody)}
    </div></div>`;
  $("#content").querySelectorAll(".hrow").forEach(r=>{ r.addEventListener("click",()=>go("home",r.dataset.id)); r.addEventListener("keydown",e=>{if(e.key==="Enter")go("home",r.dataset.id);}); });
  const toggle = k => { ui.closed.has(k)?ui.closed.delete(k):ui.closed.add(k); try{ localStorage.setItem("eos_home_closed",JSON.stringify([...ui.closed])); }catch{} render(); };
  $("#content").querySelectorAll(".card .ch").forEach(hd=>{ const k=hd.closest(".card").dataset.hk; hd.addEventListener("click",()=>toggle(k)); hd.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(k); } }); });
  paintTicker(); wireChat();
  if(route.id) renderTaskDetail(); else $("#detail").innerHTML="";
  window.scrollTo(0, keepY); requestAnimationFrame(()=>window.scrollTo(0, keepY));
}

/* ── Home search (v101): one box across what this person can already see — tasks, work orders,
   people, meetings and dashboards. Every word must match. Tasks open in the panel right on Home;
   other results open their own tab. "See all" carries the search into that tab. */
function homeSearch(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean); if(!words.length) return [];
  const hit = h => words.every(w=>h.includes(w));
  const rank = (name,rows) => rows.sort((a,b)=>(b.n.toLowerCase().startsWith(words[0])-a.n.toLowerCase().startsWith(words[0])));
  const T=(D.tasks||[]).filter(t=>hit(hay(t.task_id,t.title,t.instructions,t.notes,t.work_order_name,t.labor_names,t.location_description,t.street)))
     .sort((a,b)=>isOpen(b)-isOpen(a)).map(t=>({n:ttl(t), sub:`${t.task_id} · ${t.status}${t.work_order_name?` · ${t.work_order_name}`:""}`, go:()=>go("home",t.id)}));
  const W=(D.workorders||[]).filter(w=>hit(hay(woNum(w),w.project_name,w.aliases,w.description,w.summary,w.lead_worker_name,w.contractor_name)))
     .map(w=>({n:w.project_name, sub:`${woNum(w)} · ${w.status}${w.lead_worker_name?` · ${w.lead_worker_name}`:""}`, go:()=>go("workorders",w.id)}));
  const PR=(D.projects||[]).filter(p=>hit(hay(p.project_ref,p.name,p.aliases,p.description,p.summary,p.lead_name,p.contractor_name,p.project_type,p.project_category)))
     .map(p=>({n:p.name, sub:`${p.project_ref} · ${p.kind} · ${p.status}${p.lead_name?` · ${p.lead_name}`:""}`, go:()=>go("projects",p.id)}));
  const P=(D.people||[]).filter(p=>hit(hay(p.full_name,p.email_address,p.title,p.department,p.organization_name)))
     .map(p=>({n:p.full_name||p.email_address, sub:[p.title,p.department||p.organization_name].filter(Boolean).join(" · "), go:()=>go("people",p.id)}));
  const M=(D.meetings||[]).filter(m=>hit(hay(m.title,m.purpose,m.location,m.attendee_names,m.work_order_names)))
     .map(m=>({n:m.title, sub:[m.cadence,m.location].filter(Boolean).join(" · "), go:()=>go("meetings",m.id)}));
  const B=(D.dashboards||[]).filter(d=>hit(hay(d.title,d.description)))
     .map(d=>({n:d.title, sub:"Dashboard · opens in ArcGIS", go:()=>window.open(dashUrl(d),"_blank","noopener")}));
  return [["Tasks",T,()=>{UI.tasks.q=q;UI.tasks.statuses=new Set();go("tasks");}],["Projects",rank("",PR),()=>{UI.projects.q=q;UI.projects.statuses=new Set();go("projects");}],["Work orders",rank("",W),()=>{UI.workorders.q=q;UI.workorders.statuses=new Set();go("workorders");}],
          ["People",rank("",P),()=>{UI.people.q=q;go("people");}],["Meetings",M,()=>{UI.meetings.q=q;go("meetings");}],["Dashboards",B,null]].filter(([,r])=>r.length);
}
function bindHomeSearch(){
  const inp=$("#homeQ"), drop=$("#homeDrop"); let acts=[], sel=-1;
  const close=()=>{ drop.hidden=true; sel=-1; };
  const paint=()=>{ const q=inp.value.trim(); if(q.length<2){ close(); return; }
    const groups=homeSearch(q); acts=[];
    if(!groups.length){ drop.innerHTML=`<div class="hs-none">No matches for “${esc(q)}”</div>`; drop.hidden=false; return; }
    drop.innerHTML = groups.map(([g,rows,all])=>`<div class="hs-g">${esc(g)}<span>${rows.length}</span>${all&&rows.length>5?`<a href="#" data-all="${esc(g)}">See all</a>`:""}</div>`+
      rows.slice(0,5).map(r=>{ acts.push(r.go); return `<div class="hs-r" data-i="${acts.length-1}" role="option"><b>${esc(r.n)}</b><small>${esc(r.sub||"")}</small></div>`; }).join("")).join("");
    drop.hidden=false; sel=-1;
    drop.querySelectorAll(".hs-r").forEach(el=>el.addEventListener("mousedown",e=>{ e.preventDefault(); acts[+el.dataset.i](); close(); }));
    drop.querySelectorAll("[data-all]").forEach(a=>a.addEventListener("mousedown",e=>{ e.preventDefault(); const g=groups.find(x=>x[0]===a.dataset.all); g&&g[2]&&g[2](); close(); }));
  };
  const mark=()=>drop.querySelectorAll(".hs-r").forEach((el,i)=>el.classList.toggle("on",i===sel));
  inp.addEventListener("input",paint); inp.addEventListener("focus",paint); inp.addEventListener("blur",()=>setTimeout(close,120));
  inp.addEventListener("keydown",e=>{ const n=drop.querySelectorAll(".hs-r").length;
    if(e.key==="ArrowDown"&&n){ e.preventDefault(); sel=(sel+1)%n; mark(); }
    else if(e.key==="ArrowUp"&&n){ e.preventDefault(); sel=(sel-1+n)%n; mark(); }
    else if(e.key==="Enter"&&n){ e.preventDefault(); acts[Math.max(sel,0)](); close(); }
    else if(e.key==="Escape"){ inp.value=""; close(); } });
}

/* ── Home ticker. Sources come from settings.home.ticker. Weather is the National Weather Service
   forecast for the configured point (cached 30 min); meetings and work are from data already loaded,
   so the ticker never shows anything the viewer can't see elsewhere in EOS. */
const tickerCfg = () => ((D.home||{}).ticker)||{};
const tickerLabel = () => { const h=+tickerCfg().window_hours||48; return h%24===0 ? (h===24?"Last 24 hours":`Last ${h/24} days`) : `Last ${h} hours`; };
function homeTickerShell(){ const c=tickerCfg(); return c.enabled===false ? "" : `<div class="ticker" aria-label="City updates"><span class="tk-lab">${esc(tickerLabel())}</span><div class="tk-view"><div class="tk-track" id="tkTrack"></div></div></div>`; }
async function loadWeather(){
  const c=tickerCfg(); if(!c.lat||!c.lon) return null;
  if(D.wx && Date.now()-D.wx.at < 30*60e3) return D.wx;
  try{
    const pt = await (await fetch(`https://api.weather.gov/points/${(+c.lat).toFixed(4)},${(+c.lon).toFixed(4)}`)).json();
    const fc = await (await fetch(pt.properties.forecast)).json();
    D.wx = { at:Date.now(), periods:(fc.properties.periods||[]).slice(0,1) };
  }catch{ D.wx = { at:Date.now(), periods:[], err:true }; }
  return D.wx;
}
/* Ticker = today's weather (opens the Map with radar) + what changed in the last window_hours, newest first.
   Only items the viewer can already see: tasks and work orders come from their own loaded lists, and notes
   are kept only when their task or work order is in those lists. */
const brief = (txt,n=110) => { let x=String(txt||"").replace(/\s+/g," ").trim(); x=(x.match(/^.*?[.!?](\s|$)/)||[x])[0].trim(); return x.length>n ? x.slice(0,n-1).replace(/\s+\S*$/,"")+"…" : x; };
async function loadTickerNotes(){
  const hrs=+tickerCfg().window_hours||48;
  if(D.tkNotes && Date.now()-D.tkNotes.at < 5*60e3) return D.tkNotes;
  try{ const since=new Date(Date.now()-hrs*3600e3).toISOString();
    const rows=await rest(`v_task_notes?select=id,task_id,work_order_id,task_title,content,created_at,author_name&created_at=gte.${encodeURIComponent(since)}&order=created_at.desc&limit=120`);
    D.tkNotes={at:Date.now(), rows:rows||[]}; }
  catch{ D.tkNotes={at:Date.now(), rows:[]}; }      // below level 2 the notes view isn't readable: skip quietly
  return D.tkNotes;
}
function tickerItems(){
  const c=tickerCfg(), src=new Set(c.sources||[]), hrs=+c.window_hours||48, cut=Date.now()-hrs*3600e3, out=[], ev=[];
  if(src.has("weather") && D.wx && D.wx.periods.length){ const p=D.wx.periods[0];
    out.push(`<a class="tk-i" href="#/map/radar" title="Open the map with live radar"><b>Weather</b>${esc(p.name)}: ${esc(p.shortForecast)}, ${esc(String(p.temperature))}°${esc(p.temperatureUnit||"F")}${p.windSpeed?`, wind ${esc(p.windDirection||"")} ${esc(p.windSpeed)}`:""}</a>`); }
  const T=new Map((D.tasks||[]).map(t=>[t.id,t])), W=new Map((D.workorders||[]).map(w=>[w.id,w]));
  const ts = v => { const d=v?new Date(String(v).length===10?v+"T12:00":v):null; return d&&!isNaN(d)?d.getTime():0; };
  // who did it, shown in parentheses after the update type
  const P=new Map((D.people||[]).map(p=>[p.id,p.full_name]));
  const person = v => { if(!v) return ""; if(P.has(v)) return P.get(v); return /ingest|^eos@|^[0-9a-f-]{36}$/i.test(v) ? "" : (canSee("entered_by")?v:""); };
  const when = (at,dateOnly) => { const d=new Date(at), md=d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    return dateOnly ? md : `${md}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`; };
  const add = (at,label,href,name,text,who,dateOnly) => { if(at>=cut) ev.push({at, html:`<a class="tk-i" href="${href}"><b>${esc(label)}</b><span class="tk-by">(${esc([who,when(at,dateOnly)].filter(Boolean).join(" · "))})</span>${esc(name)}${text?` — ${esc(text)}`:""}</a>`}); };
  if(src.has("task_updates")) ((D.tkNotes||{}).rows||[]).forEach(n=>{
    const t=n.task_id&&T.get(n.task_id), w=!t&&n.work_order_id&&W.get(n.work_order_id); if(!t&&!w) return;
    add(ts(n.created_at), "Task update", t?`#/tasks/${esc(t.id)}`:`#/workorders/${esc(w.id)}`, t?ttl(t):w.project_name, brief(n.content), n.author_name||""); });
  if(src.has("tasks_completed")) T.forEach(t=>{ if(t.status==="Completed" && t.stop_date_actual) add(ts(t.stop_date_actual), "Completed", `#/tasks/${esc(t.id)}`, ttl(t), t.work_order_name||"", t.completed_by_name || (t.labor_names||[]).slice(0,2).join(", "), !!t.stop_date_actual); });
  if(src.has("new_tasks")) T.forEach(t=>{ add(ts(t.entry_date), "New task", `#/tasks/${esc(t.id)}`, ttl(t), t.work_order_name||"", t.source_from_name ? `from ${t.source_from_name}` : person(t.entered_by)); });
  if(src.has("new_work_orders")) W.forEach(w=>{ add(ts(w.entry_date), "New work order", `#/workorders/${esc(w.id)}`, w.project_name, brief(w.description,90), person(w.entered_by)); });
  if(src.has("work_order_status")) W.forEach(w=>{ if(w.status_changed_at) add(ts(w.status_changed_at), "Status change", `#/workorders/${esc(w.id)}`, w.project_name, `${w.previous_status||"—"} → ${w.status}`, w.status_changed_by_name||""); });
  ev.sort((a,b)=>b.at-a.at).slice(0,40).forEach(e=>out.push(e.html));
  return out;
}
function paintTicker(){
  const tr=$("#tkTrack"); if(!tr) return;
  const draw=()=>{ const items=tickerItems(); const t=$("#tkTrack"); if(!t) return;
    if(!items.length){ t.closest(".ticker").style.display="none"; return; }
    t.closest(".ticker").style.display="";
    t.innerHTML = items.join("") + items.join("");       // doubled so the loop is seamless
    t.style.setProperty("--tk-dur", Math.max(30, items.length*7)+"s"); };
  draw();
  const src=new Set(tickerCfg().sources||[]);
  if(src.has("weather") && !(D.wx && Date.now()-D.wx.at < 30*60e3)) loadWeather().then(draw);
  if(src.has("task_updates") && !(D.tkNotes && Date.now()-D.tkNotes.at < 5*60e3)) loadTickerNotes().then(draw);
}

/* Every meeting in the table recurs on the same weekday and time each period. The stored
   scheduled_at is the anchor; these helpers project it forward (and back) so the calendar
   shows every occurrence in the month being viewed, not just the one anchor date.
   Dates are stepped with setDate/setMonth so the local clock time survives a DST change. */
const CAD_STEP = { weekly:7, biweekly:14, "bi-weekly":14 };
function recurLabel(m){
  const w = m.next_occurrence || m.scheduled_at; if(!w) return "";
  const d = new Date(w);
  const day = d.toLocaleDateString("en-US",{weekday:"long"});
  const time = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).replace(":00","");
  const cad = (m.cadence||"").toLowerCase();
  if(cad==="monthly") return `Monthly · ${time}`;
  const every = CAD_STEP[cad]===14 ? "Every other" : "Every";
  return `${every} ${day} · ${time}`;
}
/* Occurrences of one meeting that fall inside [start,end]. */
function occurrences(m, start, end){
  if(!m.scheduled_at) return [];
  const a = new Date(m.scheduled_at);
  const cad = (m.cadence||"").toLowerCase();
  const stepDays = CAD_STEP[cad];
  const out = [];
  if(stepDays){
    const n0 = Math.floor((start - a) / (stepDays*864e5)) - 1;
    for(let n=n0; n<n0+80; n++){
      const d = new Date(a); d.setDate(a.getDate() + n*stepDays);
      if(d > end) break;
      if(d >= start) out.push(d);
    }
  } else if(cad==="monthly"){
    for(let n=-1; n<=14; n++){
      const d = new Date(a); d.setMonth(a.getMonth() + n + Math.round((start-a)/2629800000));
      if(d >= start && d <= end) out.push(d);
      if(d > end) break;
    }
  } else if(a >= start && a <= end){
    out.push(a);
  }
  return out;
}

/* Calendar. Month or week grid with three kinds of entry, each switchable:
     meetings  — every occurrence of every meeting (recurring ones projected forward);
     tasks     — open tasks on their due date, coloured by priority, red once overdue;
     work orders — a start marker on start_date and an end marker on stop_date.
   "Mine" keeps only what the signed-in person is on (attendee, labor, lead or owner). Click any
   entry to open it in its own tab. */
const PRI_CLASS = p => ({Important:"p-imp",High:"p-high",Medium:"p-med"})[p] || "p-low";
function calEvents(gridStart, gridEnd){
  const ui=UI.meetings, sh=ui.show, me=ME&&ME.id, out=[];
  const mine = (ids)=> !sh.mine || (me && (ids||[]).includes(me));
  if(sh.meetings) for(const m of (D.meetings||[])){ if(!mine(m.attendee_ids)) continue;
    for(const d of occurrences(m, gridStart, gridEnd)) out.push({kind:"meeting", page:"meetings", id:m.id, at:d, title:m.title, time:true, cls:`${m.status!=="planned"&&!m.recurring?esc(m.status):""} ${d<Date.now()?"past":""} ${route.id===m.id?"sel":""}`, tip:`${m.title}${m.recurring?" · "+recurLabel(m):""}${m.attendee_names?.length?" · "+m.attendee_names.join(", "):""}`}); }
  const today=new Date(); today.setHours(0,0,0,0);
  if(sh.tasks) for(const t of (D.tasks||[])){ if(!t.due_date || !isOpen(t)) continue; if(!mine(t.labor_ids)) continue;
    const d=new Date(t.due_date+"T12:00:00"); if(d<gridStart||d>gridEnd) continue;
    const over = d<today; out.push({kind:"task", page:"tasks", id:t.id, at:d, title:`${t.task_id} ${ttl(t)}`, cls:`task ${PRI_CLASS(t.priority)} ${over?"over":""}`, tip:`Due ${fd(t.due_date)}${over?" · OVERDUE":""} · ${t.priority||"No priority"} · ${(t.labor_names||[]).join(", ")||"unassigned"}${t.work_order_name?" · "+t.work_order_name:""}`}); }
  if(sh.wos) for(const w of (D.workorders||[])){ if(["Completed","Canceled"].includes(w.status)) continue; if(!mine([w.lead_worker_id,w.owner_id])) continue;
    for(const [k,dt,lab] of [["start",w.start_date,"▶"],["stop",w.stop_date,"■"]]){ if(!dt) continue; const d=new Date(dt+"T09:00:00"); if(d<gridStart||d>gridEnd) continue;
      out.push({kind:"wo", page:"workorders", id:w.id, at:d, title:`${lab} ${w.project_name}`, cls:`wo wo-${k}`, tip:`${k==="start"?"Starts":"Scheduled to finish"} ${fd(dt)} · ${w.status}${w.lead_worker_name?" · "+w.lead_worker_name:""}`}); } }

function calendarHTML(all){
  const ui=UI.meetings;
  const today=new Date(); today.setHours(0,0,0,0);
  if(ui.month==null){ ui.month=today.getMonth(); ui.year=today.getFullYear(); }
  const week = ui.view==="week";
  let start, ncells, heading;
  if(week){
    if(!ui.weekStart){ const d=new Date(today); d.setDate(d.getDate()-d.getDay()); ui.weekStart=d.getTime(); }
    start=new Date(ui.weekStart); ncells=7;
    const end=new Date(start); end.setDate(start.getDate()+6);
    heading = `${start.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${end.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`;
  } else {
    const first=new Date(ui.year, ui.month, 1); start=new Date(first); start.setDate(1-first.getDay()); ncells=42;
    heading = first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  const gridStart=new Date(start); gridStart.setHours(0,0,0,0);
  const gridEnd=new Date(start); gridEnd.setDate(start.getDate()+ncells-1); gridEnd.setHours(23,59,59,999);
  const byDay=new Map();
  for(const e of calEvents(gridStart, gridEnd)){ const k=e.at.toDateString(); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(e); }
  const order={meeting:0,task:1,wo:2};
  const cells=[]; let total=0;
  for(let i=0;i<ncells;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    if(!week && i>=35 && d.getMonth()!==ui.month) break;
    const evs=(byDay.get(d.toDateString())||[]).sort((a,b)=>(order[a.kind]-order[b.kind])||(a.at-b.at)); total+=evs.length;
    const cls=["cal-day", week?"wk":"", (!week&&d.getMonth()!==ui.month)?"out":"", d<today?"past":"", d.getTime()===today.getTime()?"today":""].join(" ");
    const shown=week?evs:evs.slice(0,4), more=evs.length-shown.length;
    cells.push(`<div class="${cls}"><div class="num"><b>${week?esc(d.toLocaleDateString("en-US",{weekday:"short",day:"numeric"})):d.getDate()}</b>${evs.length?`<small>${evs.length}</small>`:""}</div>
      ${shown.map(evBtn).join("")}${more>0?`<button class="ev more" data-view="week" data-week="${d.getTime()}">+${more} more</button>`:""}</div>`);
  }
  const sh=ui.show;
  return `<div class="cal ${week?"week":""}">
    <div class="cal-h"><button data-nav="-1" aria-label="Previous">‹</button><h3>${esc(heading)}</h3><button data-nav="1" aria-label="Next">›</button><button data-nav="0">Today</button>
      <span class="seg" style="margin-left:6px"><button data-view="month" class="${!week?"on":""}">Month</button><button data-view="week" class="${week?"on":""}">Week</button></span>
      <span class="muted" style="font-size:11px;margin-left:6px">${total} item${total===1?"":"s"}</span><span class="grow"></span>
      <div class="legend">

        <label><input type="checkbox" data-show="tasks" ${sh.tasks?"checked":""}><i style="background:var(--s-progress)"></i>task due dates</label>
        <label><input type="checkbox" data-show="wos" ${sh.wos?"checked":""}><i style="background:var(--ink-3)"></i>work orders</label>
        <label title="Only what you are on: attendee, labor, lead or owner"><input type="checkbox" data-show="mine" ${sh.mine?"checked":""}>mine</label>
      </div></div>

    <div class="cal-grid">${cells.join("")}</div></div>`;
}

   A citywide map of the City's own GIS layers with EOS documents and landmarks laid on top.

     • The layer list is whatever is shared to the ArcGIS Online GROUP in gis_source.group_id.

       remove it and it disappears. Item tags "eos:<class>" set the feature class and

     • Symbology is EOS's own (see SYMBOLOGY below): nothing is read from the layers' renderers.

     • Premade maps come from gis_maps (by layer name). Symbology can be changed per layer for

   Features are fetched for the visible extent only (FeatureServer /query, f=geojson), so a
   dense layer is drawn only once you are zoomed in far enough (min_zoom). */
UI.map = { street:(()=>{try{return localStorage.getItem("eos_street_on")==="1"}catch{return false}})(), vessels:(()=>{try{return localStorage.getItem("eos_vessels_on")==="1"}catch{return false}})(), trains:(()=>{try{return localStorage.getItem("eos_trains_on")==="1"}catch{return false}})(), buses:(()=>{try{return localStorage.getItem("eos_buses_on")==="1"}catch{return false}})(), radar:(()=>{try{return localStorage.getItem("eos_radar_on")==="1"}catch{return false}})(), tide:(()=>{try{return localStorage.getItem("eos_tide_on")==="1"}catch{return false}})(), buoy:(()=>{try{return localStorage.getItem("eos_buoy_on")==="1"}catch{return false}})(), on:new Set(), style:{}, basemap:"gray", openStyle:null, mapName:"", state:"loading", collapsed:new Set(JSON.parse((()=>{try{return localStorage.getItem("eos_map_collapsed")}catch{return null}})()||"[]")) };
