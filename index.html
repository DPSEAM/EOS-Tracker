/* ── ArcGIS Online sign-in (PKCE) ── */
const AGOL_KEY = "eos_agol";
const agolSession = () => { try{ return JSON.parse(sessionStorage.getItem(AGOL_KEY)||"null"); }catch{ return null; } };
const agolSave = s => { try{ s ? sessionStorage.setItem(AGOL_KEY, JSON.stringify(s)) : sessionStorage.removeItem(AGOL_KEY); }catch{} };
const agolToken = () => { const s=agolSession(); return s && s.exp > Date.now()+30000 ? s.token : null; };
const agolRedirect = () => location.origin + location.pathname;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function agolSignIn(){
  const src=D.gisSrc||{}; if(!src.client_id || !src.portal) return;
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  try{ sessionStorage.setItem(AGOL_KEY+"_pkce", JSON.stringify({verifier, state, hash:location.hash||"#/map"})); }catch{}
  const q = new URLSearchParams({client_id:src.client_id, response_type:"code", redirect_uri:agolRedirect(), code_challenge:challenge, code_challenge_method:"S256", state, expiration:"120"});
  location.href = `${src.portal.replace(/\/$/,"")}/sharing/rest/oauth2/authorize?${q}`;
}
/* Called once at boot: if ArcGIS sent us back with ?code=, exchange it for a token. */
async function agolFinishSignIn(){
  const qs = new URLSearchParams(location.search); const code=qs.get("code");
  if(!code && !qs.get("error")) return false;
  let pk=null; try{ pk=JSON.parse(sessionStorage.getItem(AGOL_KEY+"_pkce")||"null"); sessionStorage.removeItem(AGOL_KEY+"_pkce"); }catch{}
  const backTo = (pk&&pk.hash) || "#/map";
  history.replaceState(null,"", location.pathname + backTo);          // drop ?code=… from the address bar
  if(qs.get("error")){ UI.map.authError = qs.get("error_description")||qs.get("error"); return true; }
  if(!pk || pk.state!==qs.get("state")){ UI.map.authError="Sign-in could not be verified (state mismatch). Try again."; return true; }
  if(!D.gisSrc){ try{ const s=await rest("v_settings?select=value&key=eq.gis_source"); D.gisSrc=s[0]?.value||null; }catch{} }
  const src=D.gisSrc||{};
  try{
    const body=new URLSearchParams({client_id:src.client_id, grant_type:"authorization_code", code, redirect_uri:agolRedirect(), code_verifier:pk.verifier, f:"json"});
    const r=await fetch(`${src.portal.replace(/\/$/,"")}/sharing/rest/oauth2/token`,{method:"POST", body, headers:{"Content-Type":"application/x-www-form-urlencoded"}}).then(r=>r.json());
    if(r.error) throw new Error(r.error.message||r.error.error_description||"token exchange failed");
    agolSave({token:r.access_token, refresh:r.refresh_token||null, exp:Date.now()+(r.expires_in||7200)*1000, user:r.username||"", portal:src.portal});
  }catch(e){ UI.map.authError = `Sign-in failed: ${e.message}`; }
  return true;
}
async function agolRefresh(){
  const s=agolSession(), src=D.gisSrc||{}; if(!s||!s.refresh||!src.client_id) return null;
  try{
    const body=new URLSearchParams({client_id:src.client_id, grant_type:"refresh_token", refresh_token:s.refresh, f:"json"});
    const r=await fetch(`${src.portal.replace(/\/$/,"")}/sharing/rest/oauth2/token`,{method:"POST", body, headers:{"Content-Type":"application/x-www-form-urlencoded"}}).then(r=>r.json());
    if(r.error||!r.access_token) throw 0;
    agolSave({...s, token:r.access_token, exp:Date.now()+(r.expires_in||7200)*1000, refresh:r.refresh_token||s.refresh}); return r.access_token;
  }catch{ agolSave(null); return null; }
}
function agolSignOut(){ agolSave(null); D.gisLayers=null; UI.map.on=new Set(); UI.map.seeded=false; try{ sessionStorage.removeItem(AGOL_KEY+"_layers_v6"); }catch{} renderMap(); }
/* fetch JSON from ArcGIS with the session token; refresh once on an expired-token error */
async function agolFetch(url, retry=true){
  let tok=agolToken(); if(!tok){ tok=await agolRefresh(); if(!tok) throw Object.assign(new Error("signed out"),{code:"signed_out"}); }
  const r = await fetch(url + (url.includes("?")?"&":"?") + "token=" + encodeURIComponent(tok)).then(r=>r.json());
  if(r && r.error){
    if((r.error.code===498||r.error.code===499) && retry){ if(await agolRefresh()) return agolFetch(url,false); agolSave(null); throw Object.assign(new Error("signed out"),{code:"signed_out"}); }
    throw Object.assign(new Error(r.error.message||`ArcGIS error ${r.error.code}`),{code:r.error.code, details:r.error.details});
  }
  return r;
}

/* ═══ SYMBOLOGY — owned entirely by EOS ═══

   layers' own renderers. Every layer starts from a neutral default (one distinct colour per layer
   within its class) and can be restyled here:
     mode "single"    one symbol for the whole layer
     mode "unique"    a colour per value of a field (fittings by TYPE, streets by MAINTENANCE…)
     mode "graduated" colour classes over a numeric range (mains by DIAMETER, scores…)

/* A saved map can tune how a layer is read, not just how it looks (all optional, in style_overrides[layer]):

   feature popup shows. */
const minZoomFor   = l => { const s=symFor(l); return s.minZoom ?? l.min_zoom ?? 0; };

  const m = name.match(/^(.*?)(\s\(.*\))?$/); let base=m[1], qual=m[2]||"";
  base = base.replace(/^[A-Za-z]{2,5}[_-](?=\w)/,"").replace(/[_-]+/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\s+/g," ").trim();

/* ── fetching what the editor needs from ArcGIS: distinct values, min/max ── */
async function fieldValues(l, field){
  if(l.live){ const vals=[...new Set(liveProps(l).map(p=>p[field]==null?"":p[field]))]; return vals.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})); }
  const r = await agolFetch(`${l.service_url}/query?where=1%3D1&outFields=${encodeURIComponent(field)}&returnDistinctValues=true&returnGeometry=false&orderByFields=${encodeURIComponent(field)}&resultRecordCount=60&f=json`);
  return (r.features||[]).map(f=>f.attributes[field]).map(v=>v==null?"":v);
}
async function fieldRange(l, field){
  if(l.live){ const v=liveProps(l).map(p=>numOf(p[field])).filter(x=>!isNaN(x)); return v.length?[Math.min(...v),Math.max(...v)]:[0,1]; }
  const stats=[{statisticType:"min",onStatisticField:field,outStatisticFieldName:"mn"},{statisticType:"max",onStatisticField:field,outStatisticFieldName:"mx"}];
  try{ const r = await agolFetch(`${l.service_url}/query?where=1%3D1&outStatistics=${encodeURIComponent(JSON.stringify(stats))}&returnGeometry=false&f=json`); const a=r.features?.[0]?.attributes; if(a && a.mn!=null) return [+a.mn, +a.mx]; }catch{}
  const vals=(await fieldValues(l, field)).map(numOf).filter(v=>!isNaN(v));                 // text fields holding numbers
  return vals.length ? [Math.min(...vals), Math.max(...vals)] : [0,1];
}
function buildUnique(values, ramp){ const cols = ramp && RAMPS[ramp] ? rampColors(ramp, values.length) : values.map((_,i)=>CAT_PALETTE[i%CAT_PALETTE.length]); return values.map((v,i)=>({value:v, label:v===""?"(blank)":String(v), color:cols[i], fillColor:cols[i]})); }
function buildGraduated(min, max, n, ramp){
  const cols=rampColors(ramp||"blues", n), step=(max-min)/n || 1, r=v=>+v.toFixed(step<1?2:0);

}

/* re-apply the current symbology to features already on the map (no refetch) */
function restyle(l){
  if(l.live){ l.live==="vessels" ? paintVessels(true) : paintMbta(l.live); return; }
  const grp=gisGroups[l.name]; if(!grp) return;
  const needsRebuild = l.geometry==="point";                         // shape/size changes need new markers
  if(needsRebuild){ refreshGisLayers(); return; }
  grp.eachLayer(f=>{ const st=featureStyle(l, f.feature&&f.feature.properties); if(f.setStyle) f.setStyle(pathOpts(st)); });
}

async function loadGis(){
  const [src, maps, acc, dflt, streetCfg, labels, vesselCfg, trainCfg, radarCfg, marineCfg] = await Promise.all([
    D.gisSrc!==undefined ? D.gisSrc : rest("v_settings?select=value&key=eq.gis_source").then(s=>s[0]?.value||null).catch(()=>null),
    D.gisMaps || rest("v_gis_maps?select=*").catch(()=>[]),
    rest("v_gis_layer_access?select=layer_name,min_level").catch(()=>[]),
    rest("v_settings?select=value&key=eq.gis_layer_default_min_level").then(s=>+(s[0]?.value??1)).catch(()=>1),
    D.streetCfg!==undefined ? D.streetCfg : rest("v_settings?select=value&key=eq.street_imagery").then(s=>s[0]?.value||null).catch(()=>null),
    rest("v_settings?select=value&key=eq.gis_layer_labels").then(s=>s[0]?.value||{}).catch(()=>({})),
    D.vesselCfg!==undefined ? Promise.resolve(D.vesselCfg) : rest("v_settings?select=value&key=eq.vessels").then(s=>s[0]?.value||null).catch(()=>null),
    D.trainCfg!==undefined ? Promise.resolve(D.trainCfg) : rest("v_settings?select=value&key=eq.mbta").then(s=>s[0]?.value||null).catch(()=>null),
    D.radarCfg!==undefined ? Promise.resolve(D.radarCfg) : rest("v_settings?select=value&key=eq.radar").then(s=>s[0]?.value||null).catch(()=>null),
    D.marineCfg!==undefined ? Promise.resolve(D.marineCfg) : rest("v_settings?select=value&key=eq.marine").then(s=>s[0]?.value||null).catch(()=>null),
  ]);
  D.streetCfg = streetCfg; D.gisLabels = labels||{}; D.vesselCfg = vesselCfg; D.trainCfg = trainCfg; D.radarCfg = radarCfg; D.marineCfg = marineCfg;
  const access={}; acc.forEach(a=>{ access[a.layer_name]=a.min_level; });
  Object.assign(D,{gisSrc:src, gisMaps:maps, gisAccess:access, gisAccessDefault:dflt});
  const ui=UI.map;
  if(!src || !src.client_id || !src.group_id){ ui.state="unconfigured"; D.gisLayers=[]; }
  else if(!agolToken() && !(await agolRefresh())){ ui.state="signed_out"; D.gisLayers=[]; }
  else {
    try{ const every = await loadGroupLayers(src);
         // the CYVL item is special: its sublayers feed the Street imagery section, not the class list
         const sc=D.streetCfg||{}; const sl=every.filter(l=>l.street);
         D.streetLayers = sl.length ? { points: sl.find(l=>l.geometry==="point" && (!sc.points_layer || l.name.startsWith(sc.points_layer))) || sl.find(l=>l.geometry==="point"),
                                       lines:  sl.find(l=>l.geometry==="line"  && (!sc.lines_layer  || l.name.startsWith(sc.lines_layer)))  || sl.find(l=>l.geometry==="line") } : null;
         const all = every.filter(l=>!l.street);
         // gis_layer_access decides which of the group's layers this level may see (unlisted → default)
         D.gisLayers = all.filter(l => (D.gisAccess[l.name] ?? D.gisAccessDefault) <= LEVEL()); D.gisHidden = all.length - D.gisLayers.length; ui.state="ready"; }
    catch(e){ D.gisLayers=[]; ui.state = e.code==="signed_out" ? "signed_out" : (e.code===403||e.code===400 ? "not_member" : "error"); ui.lastError=e.message; }
  }
  if(!ui.seeded && ui.state==="ready"){ D.gisLayers.filter(l=>l.default_on).forEach(l=>ui.on.add(l.name)); ui.seeded=true; }
  $("#cnt-map").textContent = ui.state==="ready" ? (D.gisLayers.length||"–") : (ui.state==="signed_out"?"🔒":"–");
}
/* Read every Feature Service item in the group and expand each into its sublayers (names and
   fields only — symbology is EOS's, see above). */
async function loadGroupLayers(src){
  const portal=src.portal.replace(/\/$/,""), gid=src.group_id, pre=(src.tag_prefix||"eos:").toLowerCase();
  let cached=null; try{ cached=JSON.parse(sessionStorage.getItem(AGOL_KEY+"_layers_v6")||"null"); }catch{}
  if(cached && cached.gid===gid && cached.at > Date.now()-15*60000){ UI.map.groupTitle=cached.title; addGroupBasemaps(cached.wms||[]); return cached.layers; }   // 15-minute cache per browser session
  const group = await agolFetch(`${portal}/sharing/rest/community/groups/${gid}?f=json`);     // 403 here = signed in but not a member
  UI.map.groupTitle = group.title;
  let items=[], start=1;
  while(start>0 && start<1000){ const r=await agolFetch(`${portal}/sharing/rest/content/groups/${gid}?num=100&start=${start}&f=json`); items.push(...(r.items||[])); start=r.nextStart; }
  // Imagery services shared to the group (Nearmap etc.) become basemap buttons
  const wmsItems = items.filter(i=>/^(WMS|WMTS)$/.test(i.type) && i.url);
  const wms = (await Promise.all(wmsItems.map(async it=>{
    let data={}; try{ data = await agolFetch(`${portal}/sharing/rest/content/items/${it.id}/data?f=json`); }catch{}
    const layers = (data.layers||[]).map(l=>l.name).filter(Boolean);
    return { key:"wms_"+it.id, label: it.title, url: (data.url||it.url).replace(/[?&]service=wms.*$/i,"").replace(/\?$/,""), wms:true, layers: layers.join(",") || (data.layer||""),
             version: data.version||"1.3.0", format: (data.format||"image/jpeg"), attr: data.copyright||it.accessInformation||it.title, native: 21, type: it.type, item_id: it.id };
  }))).filter(w=>w.url);
  // Raster items tagged eos:basemap (historic mosaics, city orthos) become basemap cards too.
  // Cached tile layers draw from their tile cache; uncached map/image services through export.
  const bmTag = pre+"basemap";
  const isBm = i => (i.tags||[]).some(t=>t.toLowerCase()===bmTag) && /^(Map Service|Image Service)$/.test(i.type) && i.url;
  const rasters = (await Promise.all(items.filter(isBm).map(async it=>{
    const url = it.url.replace(/\/$/,""); let svc={}; try{ svc = await agolFetch(`${url}?f=json`); }catch{ return null; }
    const sr = (svc.tileInfo && svc.tileInfo.spatialReference) || {};
    const tiled = !!svc.tileInfo && svc.singleFusedMapCache!==false && [3857,102100].includes(sr.latestWkid||sr.wkid);
    const lods = (svc.tileInfo&&svc.tileInfo.lods)||[]; const native = lods.length ? Math.max(...lods.map(l=>l.level)) : 20;
    const clean = String(it.title).replace(/[_-]+/g," ").replace(/\b(mosaic|nad ?83|rectified)\b/ig,"").replace(/\s+/g," ").trim();
    const yr = (clean.match(/\b(1[89]\d\d|20\d\d)\b/)||[])[1];
    return { key:"ags_"+it.id, label: clean ? clean.replace(/\b[a-z]/g,c=>c.toUpperCase()) : it.title,
             group: yr && +yr < 2000 ? "Historic aerials" : "City imagery", url: tiled ? `${url}/tile/{z}/{y}/{x}` : url, export: !tiled, image: it.type==="Image Service",
             token:true, native: Math.min(native, 22), attr: it.accessInformation || "City of Beverly", underlay:"gray", item_id: it.id };
  }))).filter(Boolean);
  wms.push(...rasters);
  items = items.filter(i=>/^(Feature Service|Map Service)$/.test(i.type) && i.url && !isBm(i));
  const out=[];
  await Promise.all(items.map(async item=>{
    const tags=(item.tags||[]).map(t=>t.toLowerCase());
    const cls = tags.find(t=>t.startsWith(pre) && t!==pre+"default")?.slice(pre.length);
    const itemDefault = tags.includes(pre+"default");
    const streetTag = ((D.streetCfg&&D.streetCfg.item_tag)||"eos:streetview").toLowerCase();
    const isStreet = tags.includes(streetTag);
    // /layers returns every sublayer's full definition (renderer, fields, scales) in one request
    let defs; try{ defs = await agolFetch(`${item.url.replace(/\/$/,"")}/layers?f=json`); }catch{ return; }
    // One feature class per group item: the eos:<class> tag if present, else the item's title
    // (with a service prefix like "OPENGOV_" dropped). The group decides — no more and no less.
    const pretty = t => String(t||"").replace(/^OPENGOV[_\s-]*/i,"").replace(/[-_]+/g," ").trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()) || item.title;
    const featureClass = pretty(cls || item.title);
    (defs.layers||[]).filter(sl=>sl.type==="Feature Layer" || !sl.type).forEach(sl=>{
      const geometry = GEOM[sl.geometryType] || "point";
      const fs = (sl.fields||[]).filter(f=>!SYS_FIELD.test(f.name));
      const fields = fs.map(f=>f.name);
      const ftypes = {}; (sl.fields||[]).forEach(f=>{ ftypes[f.name]={type:f.type||"", alias:f.alias||f.name, domain:f.domain&&f.domain.codedValues?Object.fromEntries(f.domain.codedValues.map(c=>[String(c.code),c.name])):null}; });
      const oidField = ((sl.fields||[]).find(f=>f.type==="esriFieldTypeOID")||{}).name || sl.objectIdField || "OBJECTID";
      const numFields = fs.filter(f=>/Integer|Double|Single|Small|OID/.test(f.type||"") || /^(DIAMETER|Diameter|.*_YR|.*Year|.*SIZE|.*Size|.*DIAM.*|.*Score.*|.*Elevation.*|.*Length.*|.*Width.*|.*Depth.*)$/i.test(f.name)).map(f=>f.name);
      out.push({
        name: sl.name, item_title:item.title, item_id:item.id, service_url:`${item.url.replace(/\/$/,"")}/${sl.id}`, geometry,
        feature_class: featureClass,
        display_field: sl.displayField && !SYS_FIELD.test(sl.displayField) ? sl.displayField : null,
        popup_fields: fields.slice(0,12), all_fields: fields, num_fields: numFields.length?numFields:fields,
        field_meta: ftypes, oid_field: oidField, has_attachments: !!sl.hasAttachments,
        min_zoom: DEFAULT_MINZOOM[geometry],
        default_on: itemDefault, street: isStreet,
      });
    });
  }));
  // one name per layer: if two services share a sublayer name, qualify with the item title
  const seen={}; out.forEach(l=>{ seen[l.name]=(seen[l.name]||0)+1; }); out.forEach(l=>{ if(seen[l.name]>1) l.name=`${l.name} (${l.item_title})`; });
  out.sort((a,b)=>a.feature_class.localeCompare(b.feature_class) || layerLabel(a).localeCompare(layerLabel(b)));
  // neutral default symbology: one distinct colour per layer inside its class (nothing from ArcGIS)
  const perClass={}; out.forEach(l=>{ const i=perClass[l.feature_class]=(perClass[l.feature_class]??-1)+1; l.style=defaultSym(l, i); });
  try{ sessionStorage.setItem(AGOL_KEY+"_layers_v6", JSON.stringify({gid, at:Date.now(), title:group.title, layers:out, wms})); }catch{}
  addGroupBasemaps(wms);
  return out;
}
/* WMS/WMTS items in the group join the basemap row (after the built-ins). Their URLs carry the
   provider's key, so they are shown only while signed in to ArcGIS and never stored in EOS. */
function addGroupBasemaps(list){
  Object.keys(BASEMAPS).forEach(k=>{ if(BASEMAPS[k].from_group) delete BASEMAPS[k]; });
  (list||[]).forEach(w=>{ BASEMAPS[w.key]={...w, from_group:true}; });
  if($("#bmGal")) paintBmGallery();
}
function applySavedMap(m){

  ui.mapBase = JSON.parse(JSON.stringify(m.style_overrides||{})); ui.mapBaseName = m.name;
  ui.basemap = m.basemap || "gray";
  ui.mapName = m.name; ui.openStyle = null;

function setGisBasemap(key){
  if(!gisMap) return;
  const b = BASEMAPS[key] || BASEMAPS.gray; UI.map.basemap = BASEMAPS[key]?key:"gray";
  if(gisTiles) gisMap.removeLayer(gisTiles);
  if(gisUnder){ gisMap.removeLayer(gisUnder); gisUnder=null; }
  // city-only imagery (historic mosaics) sits on the Light map so the rest of the view isn't blank
  if(b.underlay && BASEMAPS[b.underlay]) gisUnder = makeBaseLayer(BASEMAPS[b.underlay]).addTo(gisMap);
  gisTiles = makeBaseLayer(b).addTo(gisMap);
  updateBmButton();
  gisTiles.on("tileerror", ()=>{ const el=$("#gisStatus"); if(el && b.wms){ el.textContent=`${b.label}: tiles not loading — check the key/referrer restriction at the provider`; setTimeout(()=>{ if(el.textContent.startsWith(b.label)) el.textContent=""; }, 4000); } });
}

/* Full screen: the whole Map tab (layer panel + map) fills the display. Uses the browser's
   Fullscreen API where available, a body class otherwise; Esc leaves either way. */
function toggleMapFullscreen(){
  // #content survives re-renders; .gis is rebuilt on every layer click, which used to drop the browser out of full screen
  const el = $("#content"); if(!el || !$("#content .gis")) return;
  const leaving = document.fullscreenElement || document.body.classList.contains("mapfull");
  if(leaving){ if(document.fullscreenElement) document.exitFullscreen?.(); document.body.classList.remove("mapfull"); }
  else if(el.requestFullscreen){ el.requestFullscreen().catch(()=>document.body.classList.add("mapfull")); }
  else document.body.classList.add("mapfull");
  setTimeout(()=>gisMap&&gisMap.invalidateSize(), 120);

function gisGate(){

  const err = ui.authError ? `<div class="err" style="margin:0 0 10px">${esc(ui.authError)}</div>` : "";
  if(ui.state==="unconfigured") return `<div class="empty"><h3>Map sign-in isn't set up yet</h3><p>EOS needs the ArcGIS Online portal, group ID and OAuth client ID in <code>settings.gis_source</code>. Until then the layer list is empty.</p></div>`;
  if(ui.state==="signed_out") return `<div class="empty">${err}<h3>Sign in to see the City's GIS layers</h3><p>The map layers are private to City ArcGIS Online users. Sign in with your City ArcGIS account; the rest of EOS stays open.</p><p><button class="refresh" id="gisSignIn" style="width:auto;padding:8px 16px">Sign in with City ArcGIS</button></p></div>`;
  if(ui.state==="not_member") return `<div class="empty"><h3>Your ArcGIS account isn't in the map group</h3><p>You're signed in as <b>${esc(s?.user||"")}</b>, but this account isn't a member of the ArcGIS Online group that holds the EOS map layers${ui.groupTitle?` (<b>${esc(ui.groupTitle)}</b>)`:""}. Ask the DPS GIS administrator to add you, then reopen this tab.</p><p><a href="#" id="gisSignOut">Sign out</a></p></div>`;

}

function updateZoomNotes(){

/* Fetch what is visible for each switched-on layer and redraw it. */
async function refreshGisLayers(){
  if(!gisMap) return;
  const ui=UI.map, my=++gisReq, z=gisMap.getZoom(), b=gisMap.getBounds();
  const env = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
  const want = (D.gisLayers||[]).filter(l=>ui.on.has(l.name));
  // drop layers no longer wanted
  Object.keys(gisGroups).forEach(n=>{ if(!want.find(l=>l.name===n)){ gisMap.removeLayer(gisGroups[n]); delete gisGroups[n]; delete gisCounts[n]; } });
  const status=$("#gisStatus"); let pending=0;
  for(const l of want){
    if(z < minZoomFor(l)){ if(gisGroups[l.name]){ gisMap.removeLayer(gisGroups[l.name]); delete gisGroups[l.name]; } gisCounts[l.name]=null; continue; }
    pending++;
    const sym=symFor(l);
    const dots = l.geometry==="point" && sym.iconMinZoom!=null && z < sym.iconMinZoom;
    // the object ID always rides along: the pop-up uses it to read the full record
    const need = [...new Set([l.oid_field||"OBJECTID", titleFieldFor(l), ...(popupFieldsFor(l)||[]), sym.mode!=="single"?sym.field:null, sym.label&&sym.label.field].filter(Boolean))];
    const pf = need.length ? need : null;
    const qurl = fields => `${l.service_url}/query?where=1%3D1&geometry=${encodeURIComponent(env)}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=${encodeURIComponent(fields)}&outSR=4326&resultRecordCount=${dots?4000:2000}&f=geojson`;
    const get = u => agolFetch(u);
    // a registry row can name fields the service no longer has; fall back to every field rather than fail
    get(qurl(pf&&pf.length ? pf.join(",") : "*")).catch(e=>{ if(pf&&pf.length && /outFields/i.test(String(e.details||e.message))){ l.popup_fields=null; l.display_field=null; return get(qurl("*")); } throw e; }).then(gj=>{
      if(my!==gisReq) return;                         // a newer move superseded this request
      // a pop-up open on this layer survives the redraw: note which feature, reopen it after
      const op = gisMap._popup, old = gisGroups[l.name];
      const keep = op && op.isOpen() && old && op._source && old.hasLayer(op._source) && gisFeat[L.stamp(op._source)]
        ? { oid: featOid(l, gisFeat[L.stamp(op._source)].f), at: op.getLatLng() } : null;
      if(old) gisMap.removeLayer(old);
      const lab = sym.label && sym.label.field && z >= (sym.label.minZoom??16) ? sym.label.field : null;
      const grp = L.geoJSON(gj, {
        style: f=>pathOpts(featureStyle(l, f.properties)),
        pointToLayer: (f,latlng)=>{ const st=featureStyle(l, f.properties); return dots ? L.circleMarker(latlng,{renderer:gisCanvas, radius:Math.max(2.5,(st.radius||4)*.6), color:st.color, weight:.6, fillColor:st.fillColor, fillOpacity:.95, opacity:.9}) : pointMarker(latlng, st); },
        onEachFeature: (f,lyr)=>{ const p=f.properties||{};
          if(lab && p[lab]!=null && p[lab]!=="") lyr.bindTooltip(esc(String(p[lab])), {permanent:true, direction:l.geometry==="point"?"top":"center", className:"gis-lbl", offset:l.geometry==="point"?[0,-6]:[0,0]});
          bindGisPopup(l, f, lyr); }
      }).addTo(gisMap);
      if(keep && keep.oid!=null){ const again = grp.getLayers().find(x=>{ const r=gisFeat[L.stamp(x)]; return r && featOid(l, r.f)===keep.oid; }); if(again) again.openPopup(again.getLatLng ? again.getLatLng() : keep.at); }
      gisGroups[l.name]=grp; gisCounts[l.name]=(gj.features||[]).length + ((gj.properties&&gj.properties.exceededTransferLimit)||(gj.exceededTransferLimit)?"+":"");
      updateZoomNotes();
    }).catch(e=>{ if(e&&e.code==="signed_out"){ UI.map.state="signed_out"; D.gisLayers=null; renderMap(); return; } gisCounts[l.name]="!"; updateZoomNotes(); }).finally(()=>{ if(--pending<=0 && status) status.textContent=""; });
  }
  if(status) status.textContent = pending ? `Loading ${pending} layer${pending===1?"":"s"}…` : "";
}
/* ── Feature popups ──────────────────────────────────────────────────────────────
   A card: layer chip + class, the display field as title, facts in a two-column grid with
   dates/domains/URLs formatted, ArcGIS attachments (photos) loaded when the popup opens, and
   actions: Zoom to · Copy coordinates · Open in ArcGIS. */
const gisFeat = {};                              // leaflet id → {l, f, lyr}
const isUrl = v => typeof v==="string" && /^https?:\/\/\S+$/i.test(v.trim());
const isImg = v => isUrl(v) && /\.(jpe?g|png|gif|webp)(\?|$)/i.test(v) ;
function fmtVal(l, k, v){
  const m = (l.field_meta||{})[k] || {};
  if(v==null || v==="") return null;
  if(m.domain && m.domain[String(v)]!=null) return esc(m.domain[String(v)]);
  if(/Date/.test(m.type) || (/(^|_)(date|dt)($|_)|date$/i.test(k) && typeof v==="number" && v>1e11)){ const d=new Date(+v); if(!isNaN(d)) return esc(d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})); }
  if(isImg(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener"><img class="pp-img" src="${esc(v)}" alt=""></a>`;
  if(isUrl(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/,"").slice(0,42))}${v.length>50?"…":""}</a>`;
  if(typeof v==="number") return esc(Number.isInteger(v)?String(v):v.toFixed(2).replace(/\.?0+$/,""));
  return esc(String(v));
}
function fieldLabel(l,k){ const m=(l.field_meta||{})[k]; return m&&m.alias&&m.alias!==k ? m.alias : k.replace(/_/g," "); }
function bindGisPopup(l, f, lyr){
  const p = f.properties||{}; const id = L.stamp(lyr); gisFeat[id] = {l, f, lyr};
  lyr.bindPopup(()=>gisPopupHTML(id), {maxWidth:360, minWidth:340, className:"pp pp-doc", autoPanPadding:[30,30]});
  lyr.on("popupopen", ()=>{ loadFullRecord(id); loadAttachments(id); });
}
/* Feature pop-up. The map query carries only the fields it needs to draw, so opening a pop-up
   reads the full record (every field, outFields=*) and repaints. Configured popupFields lead,
   then every other field in the layer's order; empty fields fold into one line at the bottom. */
function gisPopupHTML(id){
  const rec = gisFeat[id]||{}; const {l, f} = rec; if(!l) return "";
  const p = rec.full || f.properties || {};
  const tf = titleFieldFor(l);
  const oid = p[l.oid_field||"OBJECTID"] ?? (f.properties||{})[l.oid_field||"OBJECTID"];
  const title = tf && p[tf]!=null && p[tf]!=="" ? String(p[tf]) : `${layerLabel(l)}${oid!=null?" #"+oid:""}`;
  const lead = popupFieldsFor(l)||[];
  const keys = [...new Set([...lead, ...(l.all_fields||[]), ...Object.keys(p).filter(k=>!SYS_FIELD.test(k))])].filter(k=>k!==tf);
  const known = rec.full ? keys : keys.filter(k=>k in p);
  const rows=[], empty=[];
  known.forEach(k=>{ const v=fmtVal(l,k,p[k]); if(v==null) empty.push(fieldLabel(l,k)); else rows.push([k,v]); });
  const sym = featureStyle(l, f.properties||{}), s = symFor(l);
  let cls = "";
  if(s.mode==="unique" && s.field){ const c=(s.classes||[]).find(c=>String(c.value)===String((f.properties||{})[s.field])); if(c && c.label) cls=c.label; }
  const street = streetAllowed();
  return `<div class="gp">
    <div class="gp-h"><span class="gp-sw">${swatchFor(l, sym)}</span><div class="gp-ht"><b>${esc(title)}</b>
      <div class="gp-sub">${esc(layerLabel(l))}${l.feature_class && l.feature_class!==layerLabel(l)?` · ${esc(l.feature_class)}`:""}</div>
      ${cls?`<span class="gp-tag" style="--c:${esc(sym.fillColor||sym.color||"#667")}">${esc(cls)}</span>`:""}</div></div>
    <div class="pp-att gp-att" id="ppatt-${id}">${rec.att||""}</div>
    <div class="gp-list">
      ${rows.map(([k,v])=>`<div class="gp-r"><span class="gp-k">${esc(fieldLabel(l,k))}</span><span class="gp-v">${v}</span></div>`).join("") || `<div class="gp-none">No attributes recorded</div>`}
      ${rec.full ? (empty.length?`<div class="gp-empty"><span>${empty.length} empty</span> ${empty.map(esc).join(" · ")}</div>`:"") : `<div class="gp-none">Loading every field…</div>`}
      ${rec.fullErr?`<div class="gp-none">Showing the fields already on the map — ArcGIS said: ${esc(rec.fullErr)}</div>`:""}
    </div>
    ${street?`<button class="mp-btn gp-sv" id="ppsv-${id}" onclick="gisStreetFrom(${id})">${ICON_360} Beverly Street View</button>`:""}
  </div>`;
}

/* ── Street imagery (CYVL 360°) ──────────────────────────────────────────────────
   Drive runs come from v_street_image_runs as simplified lines and draw in purple, CYVL-style,
   so a street is easy to click. A click asks the database for the nearest capture point and opens
   the viewer over the map: Pannellum renders the equirectangular JPG straight from CYVL's CDN,
   north-aligned from the capture bearing; ▲/▼ (or arrow keys) step to the next/previous frame
   along the run; the position and heading show on the map underneath. */
const streetStyle = () => Object.assign({color:"#7b3fe4", weight:4, opacity:.75}, (D.streetCfg&&D.streetCfg.style)||{});
const streetAllowed = () => !!(D.streetCfg && D.streetLayers && D.streetLayers.points && (D.gisAccess[(D.streetCfg.layer_name||"Street Imagery 360")] ?? D.gisAccessDefault) <= LEVEL());
/* CYVL's image_url field is their viewer link with the real JPG in an image_url= parameter. */
const streetImgUrl = pt => { const u=String(pt.image_url||""); const m=u.match(/[?&]image_url=([^&]+)/); return m ? decodeURIComponent(m[1]) : u; };
const SF = () => Object.assign({id:"id",image_url:"image_url",bearing:"bearing",timestamp:"timestamp",prev:"prev_id",next:"next_id"}, (D.streetCfg&&D.streetCfg.fields)||{});
/* Normalise an ArcGIS point feature (esri JSON) into the viewer's shape */
function streetPt(f){ const a=f.attributes||{}, F=SF(); const ts=+a[F.timestamp]; return { id:a[F.id], image_url:a[F.image_url], bearing:+a[F.bearing]||0, captured_at: ts? new Date(ts>1e14 ? ts/1000 : (ts>1e11 ? ts : ts*1000)).toISOString() : null, prev_id:a[F.prev]||null, next_id:a[F.next]||null, lat:f.geometry&&f.geometry.y, lon:f.geometry&&f.geometry.x }; }
async function streetQuery(where, extra){ const L_=D.streetLayers.points, F=SF(); const fields=[F.id,F.image_url,F.bearing,F.timestamp,F.prev,F.next].join(",");
  const j=await agolFetch(`${L_.service_url}/query?where=${encodeURIComponent(where)}&outFields=${encodeURIComponent(fields)}&returnGeometry=true&outSR=4326&f=json${extra||""}`); return (j.features||[]).map(streetPt); }
async function streetNearest(lat, lon, radius){ const m=radius||(D.streetCfg&&D.streetCfg.search_m)||60;
  const pts=await streetQuery("1=1", `&geometry=${encodeURIComponent(JSON.stringify({x:lon,y:lat,spatialReference:{wkid:4326}}))}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=${m}&units=esriSRUnit_Meter&resultRecordCount=50`);
  if(!pts.length) return null; const d=p=>Math.hypot((p.lat-lat)*111320, (p.lon-lon)*111320*Math.cos(lat*Math.PI/180)); pts.sort((a,b)=>d(a)-d(b)); return pts[0]; }

let streetLayer=null, streetPos=null, sv=null;   // sv = {viewer, cur, hist}

  if(!D.streetRuns){ const ln=D.streetLayers.lines;
    try{ D.streetRuns = ln ? (await agolFetch(`${ln.service_url}/query?where=1%3D1&outFields=*&outSR=4326&resultRecordCount=2000&f=geojson`)).features||[] : []; }catch{ D.streetRuns=[]; }
    renderMap(); return; }

    { style:()=>({color:st.color, weight:st.weight, opacity:st.opacity, lineCap:"round", lineJoin:"round"}),
      onEachFeature:(f,lyr)=>{ lyr.on("mouseover",()=>lyr.setStyle({weight:st.weight+3, opacity:1})); lyr.on("mouseout",()=>lyr.setStyle({weight:st.weight, opacity:st.opacity}));

/* Source-email links open the thread in whatever Google account the reader has (the thread ID

/* ── search: one query against the full-text index, one against the obvious name fields ── */
const tsQuery  = q => { const t=String(q||"").toLowerCase().match(/[a-z0-9][a-z0-9._-]*/g)||[]; return t.length ? t.map((x,i)=> i===t.length-1 ? x+":*" : x).join(" & ") : null; };

let docSeq=0, docTimer=null;

async function loadDocuments(force=false){

    rest("v_document_counts?select=*").catch(()=>[]),
    D.docCats ? Promise.resolve(null) : rest("v_settings?select=value&key=eq.document_categories").then(r=>r[0]?.value||null).catch(()=>null),
    rest("v_documents?select=id,display_title,filename,file_type,document_category,department,doc_date,source_received_at,source_from_name,source_thread_id,drive_file_id,drive_url,location_status,location_text,location_source,latitude,longitude,work_order_id,work_order_name,establishment_name&latitude=not.is.null&limit=2000").catch(()=>[]),
  ]);

  updateCounts();
}
function queueDocSearch(q){ clearTimeout(docTimer); docTimer=setTimeout(()=>runDocSearch(q), 220); }
async function runDocSearch(q){
  const seq=++docSeq, term=String(q||"").trim();
  D.docSearching=true; D.docError=null; if(route.page==="documents") paintDocs();
  try{
    let rows;
    if(!term){
      rows = await rest(`v_documents?select=${DOC_COLS}&order=created_at.desc&limit=${DOC_PAGE}`);
    }else{
      const tq=tsQuery(term), lk=likeSafe(term), e=encodeURIComponent;
      const [inText, byName] = await Promise.all([
        tq ? rest(`v_documents?select=${DOC_COLS}&search_tsv=fts(english).${e(tq)}&limit=${DOC_PAGE}`).catch(()=>[]) : [],
        lk ? rest(`v_documents?select=${DOC_COLS}&or=(display_title.ilike.*${e(lk)}*,filename.ilike.*${e(lk)}*,work_order_name.ilike.*${e(lk)}*,source_subject.ilike.*${e(lk)}*,location_text.ilike.*${e(lk)}*,establishment_name.ilike.*${e(lk)}*)&limit=${DOC_PAGE}`).catch(()=>[]) : [],
      ]);
      const low=term.toLowerCase(), named=new Set(byName.map(r=>r.id)), by=new Map();
      byName.forEach(r=>by.set(r.id,{...r,_text:false}));
      inText.forEach(r=>{ if(!by.has(r.id)) by.set(r.id,{...r,_text:!hay(r.display_title,r.filename,r.work_order_name,r.source_subject,r.location_text,r.establishment_name).includes(low)}); });
      rows=[...by.values()];
    }
    if(seq!==docSeq) return;
    D.documents=rows; D.docQuery=term; D.docSearching=false;
  }catch(err){ if(seq!==docSeq) return; D.docSearching=false; D.docError=err.message; }
  if(route.page==="documents") paintDocs();
}

  const list = Array.isArray(rows) ? rows : null; if(!list || !list.length) return;

  list.forEach(b=>{ if(!b || !b.key || !b.url || b.enabled===false) return; if(b.min_level!=null && b.min_level > LEVEL()) return;
    out[b.key] = {label:b.label||b.key, url:b.url, attr:b.attr||"", native:+b.native||19, subdomains:b.subdomains, group:b.group||"Street maps", filter:b.filter||"", note:b.note_short||""}; });

const tileOpts = b => ({maxZoom:MAP_MAX_ZOOM, maxNativeZoom:b.native||19, attribution:b.attr, ...(b.subdomains?{subdomains:b.subdomains}:{}), ...(b.bounds?{bounds:b.bounds}:{})});
/* One factory for every basemap kind: plain XYZ tiles, WMS (Nearmap), cached ArcGIS tile layers

/* Card preview: the z16 tile over downtown Beverly (City Hall), fetched live from the source */
const BM_THUMB = {lat:42.5487, lon:-70.8787, z:16};
function bmThumb(b){
  const z=b.thumb_z||BM_THUMB.z, n=2**z, lat=b.thumb_lat||BM_THUMB.lat, lon=b.thumb_lon||BM_THUMB.lon;
  const x=Math.floor((lon+180)/360*n), y=Math.floor((1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n);
  if(b.wms) return wmsUrl(b, tileBBox(x,y,z));
  if(b.export) return exportUrl(b, tileBBox(x,y,z));
  const sub=(b.subdomains||"a")[0];

let docTiles=null, tileFailures=0;

  if(!docMap) return;
  if(docTiles) docMap.removeLayer(docTiles);
  tileFailures = 0;

let docMap=null, docMarkers=null, docFit=false;
/* A pin can hold several documents; each row carries enough to tell them apart at a glance:
   file-type badge (or a Drive thumbnail for photos), title, date · category · sender, and direct links. */
const IMG_EXT = /^(png|jpe?g|gif|heic|webp|bmp|tiff?)$/i;
const docExt = d => { const e=((d.filename||"").match(/\.([a-z0-9]{2,5})$/i)||[])[1]; return (e||extOf(d)||"file").toLowerCase(); };
function docPinRow(d){

  const meta = [when?fd(when):"", d.department||"", d.source_from_name?`from ${d.source_from_name}`:""].filter(Boolean).map(esc).join(" · ");
  const cat = d.document_category ? `<span class="dcat" style="--c:${docCatColor(d.document_category)}">${esc(d.document_category)}</span>` : "";

    ? `<img class="mp-th" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(d.drive_file_id)}&sz=w120" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mp-ext e-img',textContent:'${esc(ext)}'}))">`
    : `<span class="mp-ext ${isImg?"e-img":ext==="pdf"?"e-pdf":/^(xlsx?|csv)$/.test(ext)?"e-xls":/^docx?$/.test(ext)?"e-doc":""}">${esc(ext)}</span>`;

  return `<div class="mp-row${route.id===d.id?" sel":""}" data-id="${esc(d.id)}">${thumb}<div class="mp-b"><a class="mp-t" href="#/documents/${esc(d.id)}">${esc(d.display_title||d.filename)}</a>
    ${meta||cat?`<div class="mp-m">${cat}${meta}</div>`:""}${d.location_source==="work_order_fallback"||d.location_source==="work_order"?`<div class="mp-m" title="This document has no readable address of its own">📍 pinned at its work order</div>`:""}<div class="mp-l">${links}</div></div></div>`;

function docPinPopup(g){

    <div class="mp-list">${docs.map(docPinRow).join("")}</div>

const docPins = new Map();   // document id → the marker standing at its location
/* Document categories: the fixed list and colours in settings.document_categories (a database trigger

   categories shows them as slices of a ring. The legend on the map filters by category. */
const DOC_CAT_FALLBACK = [["Plans & drawings","#2F6FD0"],["Reports & studies","#1E9E6A"],["Invoices & pay apps","#E8811F"],["Contracts & POs","#8B5E34"],["Proposals & bids","#C2185B"],["Permits & regulatory","#7B3FE4"],["Meeting notes","#1F6F78"],["Photos","#D4A017"],["Schedules","#5A6B3A"],["Data & GIS","#0B7285"],["Other","#8A94A0"]];
const docCatList = () => (D.docCats && D.docCats.list && D.docCats.list.length) ? D.docCats.list.map(c=>[c.name, c.color||"#8A94A0"]) : DOC_CAT_FALLBACK;
const docCatColor = c => (docCatList().find(([n])=>n===c)||[null,"#B8C0C8"])[1];
const docCatOf = d => d.document_category || "Uncategorised";

  const n=docs.length, counts={}; docs.forEach(d=>{ const c=docCatOf(d); counts[c]=(counts[c]||0)+1; });
  const order=docCatList().map(([nm])=>nm).concat(["Uncategorised"]);
  const parts=Object.entries(counts).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));

  if(parts.length===1) bg=docCatColor(parts[0][0]);

function docLegend(){

/* Clicking a document in the list flies the map to it and opens its pin. A document with no
   coordinates leaves the map alone rather than jumping somewhere misleading — the detail panel
   already says whether the location is missing or simply could not be found. */
function zoomToDoc(id){
  if(!docMap || !id) return;
  try{ docMap.invalidateSize(); }catch{}
  const pin = docPins.get(id);
  if(!pin) return;
  docFit = true;                                  // stop the next repaint from re-fitting the bounds
  markDocPin(id);
  docMap.flyTo([pin.lat, pin.lng], Math.max(docMap.getZoom(), 17), {duration:.6});
  /* Look the pin up again once the map has settled: a repaint in between rebuilds the markers,
     and the popup has to be opened on the marker that is actually on the map now. */
  const reopen = () => { const fresh = docPins.get(id); if(fresh){ try{ fresh.marker.openPopup(); }catch{} markDocPin(id); } };
  docMap.once("moveend", ()=>setTimeout(reopen, 60));
}
/* Ring the pin of the open document so it stands out among its neighbours. */
function markDocPin(id){
  document.querySelectorAll("#docMap .doc-sel").forEach(e=>e.classList.remove("doc-sel"));
  const p = id && docPins.get(id); const el = p && p.marker.getElement && p.marker.getElement();
  if(el) el.classList.add("doc-sel");
}
function paintDocMap(){
  const el=$("#docMap"); if(!el) return;
  if(!window.L){ el.innerHTML=`<div class="map-off">The map library could not be loaded — it comes from a CDN, so this needs an internet connection. Everything else on this page still works.</div>`; return; }
  if(!docMap){
    docMap = L.map(el,{scrollWheelZoom:false}).setView([42.5584,-70.8801],13);
    setBasemap(UI.documents.basemap);
    docMarkers = L.layerGroup().addTo(docMap);
    const Lg = L.Control.extend({ options:{position:"bottomright"}, onAdd(){ const d=L.DomUtil.create("div","doc-legend"); d.id="docLegend"; L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
      d.addEventListener("click", e=>{ const b=e.target.closest("[data-dlcat]"), c=e.target.closest("[data-dlclear]"); const cats=UI.documents.cats;
        if(c){ e.preventDefault(); cats.clear(); } else if(b){ const k=b.dataset.dlcat; cats.has(k)?cats.delete(k):cats.add(k); } else return; paintDocMap(); });
      return d; } });

    const off=()=>{ docMap.scrollWheelZoom.disable(); el.classList.remove("wheel-on"); };

  const groups=new Map();
  const catsOn = UI.documents.cats, only = UI.documents.only;   // only = ids the list is showing (null = everything)
  const fitKey = [D.docQuery||"", UI.documents.loc, UI.documents.place||"", [...catsOn].sort().join("|")].join("¦");
  if(fitKey!==UI.documents.fitKey){ UI.documents.fitKey=fitKey; docFit=false; }

    if(p.latitude==null||p.longitude==null) return;

    m.on("popupopen",ev=>{

  else if(ui.loc==="text")   rows=rows.filter(d=>d.has_text);

         <td><span class="ftype">${esc(extOf(d)||"file")}</span></td>
         <td>${locCell(d)}</td>
         <td style="overflow-wrap:anywhere">${relCell(d)}</td>
         ${c2?"":`<td style="overflow-wrap:anywhere">${d.source_subject?`<div class="d" style="-webkit-line-clamp:2">“${esc(d.source_subject)}”</div><div class="type">${esc(d.source_from_name||"")}${d.source_received_at?` · ${esc(fd(d.source_received_at))}`:""}</div>`:`<span class="muted">—</span>`}</td>`}
         <td>${docActions(d)}</td></tr>`).join("")}</tbody></table></div>
       <div class="foot-row"><span>${rows.length} shown${D.docQuery?` for “${esc(D.docQuery)}”`:` of ${c.total||rows.length}`}${all.length>=DOC_PAGE?` · first ${DOC_PAGE} — narrow with search`:""}</span><span>${rows.filter(d=>d._text).length?`${rows.filter(d=>d._text).length} matched inside the text`:"Click a row for details"}</span></div></div>`;

  $("#docListWrap").innerHTML = head + chip + body;
  const cl=$("#docListWrap").querySelector("[data-clear]"); if(cl) cl.addEventListener("click",()=>{ ui.place=null; paintDocs(); });
  $("#docListWrap").querySelectorAll("tr.r").forEach(tr=>{ const open=()=>{ if(route.id===tr.dataset.id){ ui.zoomed=null; paintDocs(); } else go("documents",tr.dataset.id); };
    tr.addEventListener("click",open); tr.addEventListener("keydown",e=>{if(e.key==="Enter") open();}); });
  $("#docListWrap").querySelectorAll(".tbl").forEach(tb=>wireSort(tb,ui,{created_at:-1}));
  /* Whichever way a document was opened — list row, search result, a pin's popup, or a link from
     another tab or Chat — the map flies to it, rings its pin and the list scrolls to its row. */
  if(route.id && ui.zoomed!==route.id){
    ui.zoomed = route.id; const id = route.id;
    setTimeout(()=>{ if(route.id!==id) return; zoomToDoc(id);
      const tr=$("#docListWrap").querySelector(`tr.r[data-id="${CSS.escape(id)}"]`); if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"}); }, 90);
  }
  if(!route.id){ ui.zoomed=null; markDocPin(null); }
  renderDocumentDetail();
}

    <div class="db">

      <div class="sec pv" id="pv"><h4>Preview</h4><div class="seg">${[["file","Document"],["text","Extracted text"]].map(([k,l])=>`<button data-m="${k}" class="${UI.docPreview.mode===k?"on":""}">${l}</button>`).join("")}</div><div id="pvBody" class="muted">Loading…</div></div>
      ${d.description?`<div class="sec"><div class="desc">${esc(d.description)}</div></div>`:""}
      <div class="sec"><h4>Related to</h4><dl class="kv">

        <dt>Organization</dt><dd>${d.organization_name?`<a href="#/people/org:${esc(d.organization_id)}">${esc(d.organization_name)}</a>`:"—"}</dd>
        ${d.establishment_name?`<dt>Establishment</dt><dd>${esc(d.establishment_name)}${d.source_folder_name?`<div class="muted" style="font-size:11px">Drive folder: ${esc(d.source_folder_name)}</div>`:""}</dd>`:""}
        ${d.document_category?`<dt>Document type</dt><dd>${esc(d.document_category)}</dd>`:""}
        ${d.doc_date?`<dt>Document date</dt><dd class="num">${esc(d.doc_date)}</dd>`:""}
        <dt>Location</dt><dd>${d.location_state==="mapped"?`${esc(d.location_text)} <span class="muted" style="font-size:11px">· from ${esc((d.location_source||"").replace("_"," "))}</span><div class="muted num" style="font-size:11px">${(+d.latitude).toFixed(5)}, ${(+d.longitude).toFixed(5)}</div>`
          : d.location_state==="named" ? `${esc(d.location_text)} <span class="flag lostloc">Not found on the map</span>`

    body.innerHTML = url ? `<iframe src="${esc(url)}" allow="autoplay" loading="lazy" title="Document preview"></iframe><div class="muted" style="font-size:11px;margin-top:6px">Rendered by Google Drive. If it asks for access, sign into the browser with a City account that can open the EOS Documents folder, or use Extracted text.</div>`
                         : `<div class="muted">No file in Drive to preview${d.has_text?' — switch to Extracted text.':'.'}</div>`;
  } else {
    body.innerHTML = `<span class="muted">Loading text…</span>`;
    const txt = await textFor(d.id); if(route.id!==d.id) return;
    body.innerHTML = txt ? `<pre class="txt">${esc(txt)}</pre>` : `<div class="muted">No text has been extracted for this document${d.drive_url?' — it may be an image or a scan without readable text.':'.'}</div>`;
  }
}

/* ═════════ TASKS ═════════ */
function taskFilter(t,f){
  switch(f){ case "open": return isOpen(t); case "overdue": return t.is_overdue; case "blocked": return !!t.progress_status; case "unassigned": return isOpen(t)&&!t.lead_labor_id; case "noproject": return isOpen(t)&&!t.work_order_id; case "done": return t.status==="Completed"; case "review": return t.review_status==="open"; default: return true; }
}
function renderTasks(){
  const ui=UI.tasks, all=D.tasks||[];
  const open=all.filter(isOpen);
  if(mountBar("tasks", `<h1>Tasks</h1>
    <input type="search" id="q" placeholder="Search tasks, work orders, people, activity…" value="${esc(ui.q)}">
    <select id="grp"><option value="none"${ui.group==="none"?" selected":""}>No grouping</option><option value="project"${ui.group==="project"?" selected":""}>Group by work order</option><option value="lead"${ui.group==="lead"?" selected":""}>Group by labor</option><option value="dept"${ui.group==="dept"?" selected":""}>Group by department</option><option value="org"${ui.group==="org"?" selected":""}>Group by organization</option></select>
    <span class="grow"></span>${canEdit("tasks")?`<button class="tbtn new" id="newBtn">+ New task</button>`:""}<button class="tbtn" id="expBtn" title="Download what this list is showing">⤓ Export</button><button onclick="window.print()" class="tbtn">Print</button>`)){
    $("#q").addEventListener("input",e=>{ui.q=e.target.value;render();});
    $("#grp").addEventListener("change",e=>{ui.group=e.target.value;render();});
    $("#expBtn").addEventListener("click",e=>listExportMenu(e.currentTarget,"tasks"));
    $("#newBtn")?.addEventListener("click",()=>startNew("tasks","tasks"));
  }
  const inSys = all;   // v103: the "which system" filter is gone — every task is EOS-only today
  const openS = inSys.filter(isOpen);
  // v103: one tile per status. Click to show or hide that status; default is In Progress + Planned.
  if(!ui.statuses) ui.statuses = new Set(["In Progress","Planned"]);
  const ORDER=["In Progress","Planned","Completed","Canceled"];
  const present=[...new Set(all.map(t=>t.status).filter(Boolean))];
  const stList=[...ORDER.filter(x=>present.includes(x)||x==="In Progress"||x==="Planned"), ...present.filter(x=>!ORDER.includes(x)).sort()];
  const tiles=stList.map(st=>[st, STATUS[st]||st, all.filter(t=>t.status===st).length, "tst-"+stSlug(st)]);
  let rows = inSys.filter(t=>!ui.statuses.size || ui.statuses.has(t.status));
  setHL(ui.q);
  if(ui.q){ const q=ui.q.toLowerCase(); rows=rows.filter(t=>hay(t.task_id,t.opengov_id,t.legacy_id,t.title,t.instructions,t.notes,t.work_order_name,t.labor_names,t.organization_name,t.activity,t.work_type,t.trade,t.progress_status,t.department,t.asset,t.street).includes(q)); }
  rows = sortBy(rows,ui.sort,ui.dir,{ priority:(a,b)=>((PRI[a.priority]??9)-(PRI[b.priority]??9))||((STO[a.status]??9)-(STO[b.status]??9)), status:(a,b)=>(STO[a.status]??9)-(STO[b.status]??9), task_id:(a,b)=>a.task_id.localeCompare(b.task_id) });
  ui.lastRows = rows;     // Export takes exactly what the list shows

  // With the detail panel open the table has ~half the width: drop two columns and tighten the rest.
  const compact = !!route.id;
  const header = `<thead><tr>${th("ID","task_id",ui)}${th("Task","title",ui)}${th("Status","status",ui)}${th("Priority","priority",ui)}${th("Work order","work_order_name",ui)}${th("Labor","lead_labor_name",ui)}${compact?"":th("Progress status","progress_status",ui)}${th("Due","due_date",ui)}${compact?"":th("Modified","last_modified",ui)}</tr></thead>`;
  const cols = compact
    ? `<colgroup><col style="width:64px"><col><col style="width:88px"><col style="width:78px"><col style="width:120px"><col style="width:100px"><col style="width:72px"></colgroup>`
    : `<colgroup><col style="width:74px"><col><col style="width:104px"><col style="width:92px"><col style="width:150px"><col style="width:130px"><col style="width:140px"><col style="width:90px"><col style="width:84px"></colgroup>`;
  const row = t => `<tr class="r${route.id===t.id?" sel":""}" data-id="${esc(t.id)}" tabindex="0">
    ${idCell(t.task_id, t.opengov_id)}
    <td><div class="t">${t.review_status==="open"?`<span class="flag review" title="${esc((t.review_reasons||[]).join(" · "))}">Review</span>`:""}${t.is_overdue?`<span class="flag over">Overdue</span>`:""}${hl(ttl(t))}</div>${ui.filter==="review"&&(t.review_reasons||[]).length?`<div class="d rv-why">${hl(t.review_reasons.join(" · "))}</div>`:t.notes&&!compact?`<div class="d">${hl(t.notes)}</div>`:""}<div class="type" style="text-transform:none">${esc(t.activity||t.work_type||"")}${t.note_count?` · ${t.note_count} note${t.note_count>1?"s":""}`:""}${t.doc_count?` · ${t.doc_count} doc${t.doc_count>1?"s":""}`:""}</div></td>
    <td>${pill(t.status)}</td><td>${prio(t.priority)}</td>
    <td class="ellip">${t.work_order_name?`<a href="#/workorders/${esc(t.work_order_id)}" onclick="event.stopPropagation()">${hl(t.work_order_name)}</a>`:`<span class="muted">—</span>`}</td>
    <td class="ellip">${t.lead_labor_name?`${hl(t.lead_labor_name)}${(t.labor_names||[]).length>1?`<div class="d">+${t.labor_names.length-1} more</div>`:""}`:`<span class="muted">—</span>`}</td>
    ${compact?"":`<td class="ellip">${t.progress_status?esc(t.progress_status):`<span class="muted">—</span>`}</td>`}
    <td class="num" style="${t.is_overdue?"color:var(--s-blocked);font-weight:600":""}">${t.due_date?esc(compact?new Date(t.due_date).toLocaleDateString("en-US",{month:"short",day:"numeric"}):fd(t.due_date)):`<span class="muted">—</span>`}</td>
    ${compact?"":`<td class="num muted" title="${esc(fdt(t.last_modified))}">${esc(ago(t.last_modified))}</td>`}</tr>`;

  let tableHTML;
  if(!all.length){
    tableHTML = `<div class="empty"><h3>No tasks yet</h3><p>The hourly Gmail ingest hasn't filed any tasks. ${D.last?`Last run ${esc(ago(D.last.started_at))} — ${esc(STATUS[D.last.status]||D.last.status)}${D.last.summary?`: ${esc(D.last.summary)}`:""}`:"No ingest run has been recorded yet."}</p><p>Check <a href="#/system">System Health</a> for run details.</p></div>`;
  }else if(!rows.length){
    tableHTML = `<div class="empty"><h3>Nothing matches</h3><p>Change the filter tile or clear the search.</p></div>`;
  }else if(ui.group!=="none"){
    const keyOf = t => ui.group==="project" ? (t.work_order_name||"No work order") : ui.group==="lead" ? (t.lead_labor_name||"No labor") : ui.group==="dept" ? (t.department||"No department") : (t.organization_name||"No organization");
    const groups = new Map(); rows.forEach(t=>{ const k=keyOf(t); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(t); });
    ui.collapsed = ui.collapsed || new Set();
    const gkey = k => ui.group+"::"+k;
    const ordered = [...groups.entries()].sort((a,b)=>b[1].length-a[1].length);
    const allCollapsed = ordered.every(([k])=>ui.collapsed.has(gkey(k)));
    const summary = ([k,ts]) => { const o=ts.filter(isOpen).length, od=ts.filter(t=>t.is_overdue).length; return `${ts.length} task${ts.length!==1?"s":""}${o!==ts.length?` · ${o} open`:""}${od?` · <span style="color:var(--s-blocked);font-weight:600">${od} overdue</span>`:""}`; };
    tableHTML = `<div class="grp-tools"><span class="muted">${ordered.length} group${ordered.length!==1?"s":""} · ${rows.length} task${rows.length!==1?"s":""}</span><span class="grow"></span><button class="lnk" data-gall="${allCollapsed?"expand":"collapse"}">${allCollapsed?"Expand all":"Collapse all"}</button></div>` +
      ordered.map(([k,ts])=>{ const c=ui.collapsed.has(gkey(k)); return `<div class="tbl grp${c?" closed":""}" style="margin-bottom:10px"><div class="ch grp-h" data-g="${esc(k)}" role="button" tabindex="0" aria-expanded="${!c}"><span class="chev">▾</span><b>${esc(k)}</b><span class="muted num">${summary([k,ts])}</span></div>${c?"":`<div class="scroll"><table>${cols}${header}<tbody>${ts.map(row).join("")}</tbody></table></div>`}</div>`; }).join("");
  }else{
    tableHTML = `<div class="tbl"><div class="scroll"><table>${cols}${header}<tbody>${rows.map(row).join("")}</tbody></table></div><div class="foot-row"><span>${rows.length} of ${all.length} tasks</span><span>Click a row for details</span></div></div>`;
  }
  // Flagged for review: the ingest marked these for a human decision. One email carries every
  // decision back; the next ingest applies it and marks the task resolved.
  let rvBar = "";
  if(ui.filter==="review"){ const fl = inSys.filter(t=>t.review_status==="open");
    const body = fl.length ? `EOS review corrections — ${new Date().toLocaleDateString()}\n\n` + fl.map(t=>`Task ${t.task_id} — ${ttl(t)}\n  Flagged: ${(t.review_reasons||[]).join("; ")}\n  Decision: \n`).join("\n") : "";
    rvBar = `<div class="rv-bar"><span>${fl.length?`<b>${fl.length}</b> task${fl.length!==1?"s":""} waiting on a decision. Write the decision under each one and send — the next ingest applies it.`:"Nothing is waiting on a decision."}</span>${fl.length?`<a href="${esc(gmailCompose("EOS review corrections", body))}" target="_blank" rel="noopener">Compose correction email (${fl.length})</a>`:""}</div>`; }
  $("#content").innerHTML = `<div class="tiles">${tiles.map(([k,l,n,c])=>`<div class="tile stt ${c} ${ui.statuses.has(k)?"on":""}" data-f="${esc(k)}" role="button" aria-pressed="${ui.statuses.has(k)}" title="Click to ${ui.statuses.has(k)?"hide":"show"} ${esc(l)}"><b>${n}</b><span>${l}</span></div>`).join("")}</div>${rvBar}${tableHTML}`;
  $("#content").querySelectorAll(".tile").forEach(x=>x.addEventListener("click",()=>{ const st=x.dataset.f; ui.statuses.has(st)?ui.statuses.delete(st):ui.statuses.add(st); render(); }));
  $("#content").querySelectorAll("tr.r").forEach(tr=>{ tr.addEventListener("click",()=>go("tasks",tr.dataset.id)); tr.addEventListener("keydown",e=>{if(e.key==="Enter")go("tasks",tr.dataset.id);}); });
  $("#content").querySelectorAll(".tbl").forEach(tb=>wireSort(tb,ui,{last_modified:-1,due_date:1}));
  const toggleGroup = k => { ui.collapsed = ui.collapsed || new Set(); const key=ui.group+"::"+k; ui.collapsed.has(key) ? ui.collapsed.delete(key) : ui.collapsed.add(key); render(); };
  $("#content").querySelectorAll(".grp-h").forEach(h=>{ h.addEventListener("click",()=>toggleGroup(h.dataset.g)); h.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleGroup(h.dataset.g); } }); });
  const gall=$("#content").querySelector("[data-gall]");
  if(gall) gall.addEventListener("click",()=>{ ui.collapsed = ui.collapsed || new Set(); const keys=[...$("#content").querySelectorAll(".grp-h")].map(h=>ui.group+"::"+h.dataset.g); if(gall.dataset.gall==="collapse") keys.forEach(k=>ui.collapsed.add(k)); else keys.forEach(k=>ui.collapsed.delete(k)); render(); });
  renderTaskDetail();
}

const EV_LABEL = {email:"Update from email", note:"Note", created:"Created", review:"Flagged for review", resolved:"Review resolved", correct:"Correction applied", merge:"Merged", split:"Split", done:"Completed"};
/* What kind of timeline entry a notes-table row is. */
function noteKind(n){
  const c = n.content||"";
  if(/^Merged (duplicate task|from)/i.test(c)) return "merge";
  if(/^Corrected per|review corrections/i.test(c)) return "correct";
  if(/^Split from|split out to/i.test(c)) return "split";
  if(n.source_email_id) return "email";
  return "note";
}
/* Headers take a light tint of the record's state. */
function tintFor(status, overdue){
  if(overdue) return "tint-over";
  if(status==="Completed") return "tint-done";
  if(status==="Canceled") return "tint-cancel";
  if(status==="In Progress") return "tint-progress";
  return "tint-planned";
}
function evDate(at){ const d=new Date(at); const y=d.getFullYear()!==new Date().getFullYear();
  return `${d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:y?"numeric":undefined})} · ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`; }
/* events: [{kind, at, title?, body, meta?}] → timeline HTML. Shows the newest 6; the rest fold. */
function timelineHTML(events, emptyText){
  const ev = events.filter(e=>e.at).sort((a,b)=>new Date(b.at)-new Date(a.at));
  if(!ev.length) return `<div class="muted">${emptyText||"Nothing recorded yet"}</div>`;
  const item = e => `<li class="tle k-${e.kind}"><span class="ev-ic" title="${esc(EV_LABEL[e.kind]||"")}">${ICON[e.kind]||ICON.note}</span>
    <div class="ev-b"><div class="ev-h"><b>${esc(e.title||EV_LABEL[e.kind]||"")}</b><span>${esc(evDate(e.at))}</span></div>
    ${e.body?`<div class="ev-t">${e.bodyHTML?e.body:esc(e.body)}</div>`:""}${e.meta?`<div class="ev-m">${e.meta}</div>`:""}</div></li>`;
  const head = ev.slice(0,6), rest = ev.slice(6);
  return `<ol class="tl">${head.map(item).join("")}</ol>${rest.length?`<details class="tl-more"><summary>${rest.length} earlier</summary><ol class="tl">${rest.map(item).join("")}</ol></details>`:""}`;
}
const noteEvent = (n, showTask) => {
  const bits=[]; if(n.author_name) bits.push(esc(n.author_name));
  if(n.source_subject) bits.push(`“${esc(n.source_subject)}”`);
  if(showTask && n.task_id && n.task_number!=null) bits.unshift(`<span class="tref" onclick="go('tasks','${esc(n.task_id)}')">${esc(taskRef(n.task_number))} ${esc(n.task_title||"")}</span>`);
  if(n.source_thread_id) bits.push(`<a href="${esc(gmailLink(n.source_thread_id))}" target="_blank" rel="noopener">open email</a>`);

/* Updates read newest-first: the most recent one in full at the top, everything older
   folded into a scrollable history. `showTask` tags each line with the task it came from,
   which is what makes the work-order rollup legible. */
function noteMeta(n, showTask){
  const d = new Date(n.event_at || n.created_at);
  const bits = [d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined}),
                d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})];
  if(n.author_name) bits.push(esc(n.author_name));
  if(showTask && n.task_id && n.task_number!=null)
    bits.push(`<span class="tref" onclick="go('tasks','${esc(n.task_id)}')">${esc(taskRef(n.task_number))} ${esc(n.task_title||"")}</span>`);
  if(n.source_subject) bits.push(`“${esc(n.source_subject)}”`);
  if(n.event_from_email===false) bits.push(`<span title="No source email — dated when the note was written">recorded</span>`);
  return bits.join(" · ");
}
function notesHTML(notes, showTask){
  if(!notes.length) return `<span class="muted">No updates yet</span>`;
  const sorted=[...notes].sort((a,b)=>new Date(b.event_at||b.created_at)-new Date(a.event_at||a.created_at));
  const [latest, ...rest] = sorted;
  let out = `<div class="upd-latest">${esc(latest.content)}<div class="m">${noteMeta(latest, showTask)}</div></div>`;
  if(!rest.length) return out;
  let lastDay=null, hist="";
  for(const n of rest){
    const d=new Date(n.event_at||n.created_at);
    const day=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined});
    if(day!==lastDay){ hist+=`<div class="nday">${esc(day)}</div>`; lastDay=day; }
    hist+=`<div class="note">${esc(n.content)}<div class="m">${noteMeta(n, showTask)}</div></div>`;
  }
  out += `<details class="upd-hist"><summary>${rest.length} earlier update${rest.length===1?"":"s"}</summary><div class="upd-body">${hist}</div></details>`;
  return out;
}

/* ═════════ EDITING (v114) ═════════
   Every write goes through eos_edit / eos_create / eos_undo / eos_unlock_field (level checked in the database).
   Which fields can be edited, their labels and input types all come from settings.editing — nothing is hard-coded here.
   Fields edited here are locked against the hourly email ingest; Edit history shows locks, blocked email values and undo. */
const EDIT = { cfg:null };
const canEdit = table => !!(EDIT.cfg && EDIT.cfg.tables && EDIT.cfg.tables[table] && LEVEL() >= (EDIT.cfg.min_level ?? 6));
const edFields = table => (EDIT.cfg && EDIT.cfg.tables[table] && EDIT.cfg.tables[table].fields) || {};
/* Fields in the order settings.editing lists them (the database stores the field map unordered). */
const edList = table => { const F=edFields(table), ord=(EDIT.cfg.tables[table]||{}).order||[]; return [...ord.filter(k=>F[k]), ...Object.keys(F).filter(k=>!ord.includes(k))].map(k=>[k,F[k]]); };
const ED_SHORT = new Set(["select","date","number","bool","suggest","person","work_order","text"]);
const edBlank = v => v==null || v==="" || (Array.isArray(v) && !v.length);
function edSame(f, a, b){
  if(edBlank(a) && edBlank(b)) return true;
  if(f.type==="date") return String(a||"").slice(0,10)===String(b||"").slice(0,10);
  if(f.type==="number") return Number(a)===Number(b);
  if(f.type==="bool") return !!a===!!b;
  if(Array.isArray(a)||Array.isArray(b)) return JSON.stringify(a||[])===JSON.stringify(b||[]);
  return String(a??"")===String(b??"");
}
const personName = id => ((D.people||[]).find(p=>p.id===id)||{}).full_name || "Unknown person";
const woName = id => { const w=(D.workorders||[]).find(x=>x.id===id); return w ? `${woNum(w)} ${w.project_name}` : "Unknown work order"; };
function edOptions(list, cur){ return list.map(([v,l])=>`<option value="${esc(v)}"${String(cur??"")===String(v)?" selected":""}>${esc(l)}</option>`).join(""); }
function edPeopleList(){ return (D.people||[]).filter(p=>!p.inactive).slice().sort((a,b)=>(a.full_name||"").localeCompare(b.full_name||"")); }
function edInput(table, k, f, v){

  switch(f.type){

    case "number":   return `<input type="number" step="any" ${a} value="${esc(v??"")}">`;
    case "bool":     return `<input type="checkbox" ${a}${v?" checked":""}>`;
    case "select": { const opts=[...(f.options||[])]; if(v && !opts.includes(v)) opts.unshift(v);
                     return `<select ${a}>${edBlank(v)?`<option value=""></option>`:""}${edOptions(opts.map(o=>[o,o]), v)}</select>`; }
    case "suggest": { const rows = table==="work_orders" ? D.workorders : table==="documents" ? D.documents : D.tasks;
                      const vals=[...new Set((rows||[]).map(r=>r[k]).filter(x=>x && typeof x==="string"))].sort();
                      return `<input type="text" ${a} list="dl_${esc(k)}" value="${esc(v??"")}" autocomplete="off"><datalist id="dl_${esc(k)}">${vals.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`; }
    case "person":   return `<select ${a}><option value="">— none —</option>${edOptions(edPeopleList().map(p=>[p.id,p.full_name+(p.person_type&&p.person_type!=="employee"?` (${p.organization_name||p.person_type})`:"")]), v)}${v&&!edPeopleList().some(p=>p.id===v)?`<option value="${esc(v)}" selected>${esc(personName(v))}</option>`:""}</select>`;
    case "project": { const list=(D.projects||[]).slice().sort((x,y)=>(x.kind+x.name).localeCompare(y.kind+y.name));
                     return `<select ${a}><option value="">— none —</option>${edOptions(list.map(p=>[p.id,`${p.name}  ·  ${p.project_ref}${p.kind==="Program"?" · Program":""}`]), v)}</select>`; }
    case "milestones": { const ms = Array.isArray(v)?v:[];
                     return `<textarea ${a} rows="${Math.max(4, ms.length+2)}" placeholder="One per line:  Name | target date | done date&#10;e.g.  Bid opening | 2026-11-15 |&#10;      Notice to proceed | 2026-12-01 | 2026-12-03">${esc(ms.map(m=>[m.name||"", m.target||"", m.done||""].join(" | ")).join("\n"))}</textarea><div class="muted" style="font-size:11px;margin-top:3px">One milestone per line: <b>Name | target date | done date</b> (dates as YYYY-MM-DD; leave done blank until it happens).</div>`; }
    case "work_order": { const list=(D.workorders||[]).slice().sort((x,y)=>(x.project_name||"").localeCompare(y.project_name||""));
                     return `<select ${a}><option value="">— none —</option>${edOptions(list.map(w=>[w.id,`${w.project_name}  ·  ${woNum(w)}`]), v)}</select>`; }
    case "people": { const ids = Array.isArray(v)?v:[];
                     return `<div class="ed-people" ${a} data-ids='${esc(JSON.stringify(ids))}'><span class="ed-chips"></span><select class="ed-add"><option value="">+ Add person…</option>${edOptions(edPeopleList().map(p=>[p.id,p.full_name]), "")}</select></div>`; }
    case "levels": { const on = new Set(Array.isArray(v)?v:[]);
                     return `<div class="ed-levels" ${a}>${[0,1,2,3,4,5,6].map(n=>`<label><input type="checkbox" value="${n}"${on.has(n)?" checked":""}>${n}</label>`).join("")}</div>`; }
    case "tags":     return `<input type="text" ${a} value="${esc((Array.isArray(v)?v:[]).join(", "))}" placeholder="Separate with commas">`;
    case "task": { const list=(D.tasks||[]).filter(t=>isOpen(t)||t.id===v).slice().sort((x,y)=>String(y.task_id).localeCompare(String(x.task_id)));
                   return `<select ${a}><option value="">— none —</option>${edOptions(list.map(t=>[t.id,`${t.task_id} · ${ttl(t)}`.slice(0,90)]), v)}</select>`; }
    case "doc_category": { const names=docCatList().map(c=>c[0]); if(v && !names.includes(v)) names.unshift(v);
                   return `<select ${a}><option value="">${edBlank(v)?"— let the reader decide —":"— none —"}</option>${edOptions(names.map(n=>[n,n]), v)}</select>`; }
    default:         return `<input type="text" ${a} value="${esc(v??"")}"${f.max?` maxlength="${f.max}"`:""}>`;
  }
}
function edRead(form, k, f){
  const el = form.querySelector(`[data-k="${CSS.escape(k)}"]`); if(!el) return undefined;
  switch(f.type){
    case "bool":   return el.checked;
    case "number": return el.value==="" ? null : Number(el.value);
    case "people": return JSON.parse(el.dataset.ids||"[]");
    case "levels": return [...el.querySelectorAll("input:checked")].map(x=>+x.value);
    case "tags":   return el.value.split(",").map(s=>s.trim()).filter(Boolean);
    case "milestones": return el.value.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(r=>r[0])
                          .map(([name,target,done])=>({name, target: /^\d{4}-\d\d-\d\d$/.test(target||"")?target:null, done: /^\d{4}-\d\d-\d\d$/.test(done||"")?done:null}));
    case "textarea": { const s=el.value.replace(/\s+$/,""); return s.trim()==="" ? null : s; }
    default:       { const s=el.value.trim(); return s==="" ? null : s; }
  }
}
function edPaintChips(box){
  const ids = JSON.parse(box.dataset.ids||"[]");
  box.querySelector(".ed-chips").innerHTML = ids.length ? ids.map((id,i)=>`<span class="ed-chip">${esc(personName(id))}${i===0&&ids.length>1?` <small>lead</small>`:""}<button type="button" data-rm="${esc(id)}" title="Remove">×</button></span>`).join("") : `<span class="muted">Nobody assigned</span>`;
}
/* The form: short fields two-up, long text full width. `orig` is the record (or {} for a new one). */
function editFormHTML(table, orig, isNew){
  const F = edFields(table);
  const cells = edList(table).map(([k,f])=>{
    const wide = !ED_SHORT.has(f.type) || f.type==="text" && /title|name|location|instructions/i.test(k) && k!=="location_2";
    if(f.type==="bool") return `<label class="ed-f ed-bool${wide?" wide":""}">${edInput(table,k,f,orig[k])}<span>${esc(f.label)}</span></label>`;
    return `<div class="ed-f${wide?" wide":""}"><label for="ef_${esc(k)}">${esc(f.label)}${f.required?` <i>*</i>`:""}${f.max?` <small class="muted">max ${f.max}</small>`:""}</label>${edInput(table,k,f,orig[k])}</div>`;
  }).join("");

      <div class="ed-grid">${cells}</div>

    </form>`;

function wireEditForm(table, orig, isNew, page){
  const form=$("#editForm"); if(!form) return;
  form.querySelectorAll(".ed-people").forEach(box=>{
    edPaintChips(box);
    box.addEventListener("click", e=>{ const id=e.target.closest("[data-rm]")?.dataset.rm; if(!id) return;
      box.dataset.ids=JSON.stringify(JSON.parse(box.dataset.ids).filter(x=>x!==id)); edPaintChips(box); });
    box.querySelector(".ed-add").addEventListener("change", e=>{ const id=e.target.value; if(!id) return;
      const ids=JSON.parse(box.dataset.ids); if(!ids.includes(id)) ids.push(id); box.dataset.ids=JSON.stringify(ids); e.target.value=""; edPaintChips(box); });
  });
  const leave = () => { UI.edit=null; if(isNew) go(page, UI.newFrom||null); else { $("#detail").innerHTML=""; render(); } UI.newFrom=null; };
  $("#edCancel").addEventListener("click", leave);
  form.addEventListener("keydown", e=>{ if(e.key==="Escape"){ e.preventDefault(); leave(); } if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", async e=>{
    e.preventDefault(); const F=edFields(table), out={}; $("#edErr").textContent="";
    for(const [k,f] of edList(table)){ const v=edRead(form,k,f); if(v===undefined) continue;
      if(isNew){ if(!edBlank(v) && !(f.type==="bool" && v===false)) out[k]=v; }
      else if(!edSame(f, orig[k], v)) out[k]=v; }
    const missing = edList(table).filter(([k,f])=>f.required && edBlank(edRead(form,k,f))).map(([k,f])=>f.label);
    if(missing.length){ $("#edErr").textContent = `${missing.join(", ")} ${missing.length===1?"is":"are"} required.`; form.querySelector(`[data-k="${CSS.escape(edList(table).find(([k,f])=>f.required&&edBlank(edRead(form,k,f)))[0])}"]`)?.focus(); return; }
    if(!isNew && !Object.keys(out).length){ leave(); return; }
    const btn=$("#edSave"); btn.disabled=true; btn.textContent="Saving…";
    try{
      if(isNew){
        const r = await rpc("eos_create",{p_table:table, p_values:out});
        UI.edit=null; UI.newFrom=null; await refreshAfterEdit(); go(page, r.id);
        editToast(`${(EDIT.cfg.tables[table].label||"Record").replace(/^./,c=>c.toUpperCase())} created`);
      } else {
        const r = await rpc("eos_edit",{p_table:table, p_id:orig.id, p_patch:out});
        UI.edit=null; $("#detail").innerHTML=""; await refreshAfterEdit(); render();
        editToast(r.changed ? `Saved ${r.changed} change${r.changed===1?"":"s"}` : "No changes", r.changed ? r.batch : null);
      }
    }catch(err){ btn.disabled=false; btn.textContent=isNew?"Create":"Save"; $("#edErr").textContent=edError(err.message); }
  });
  setTimeout(()=>form.querySelector("input,textarea,select")?.focus(), 30);
}
function edError(m){
  if(/tasks_title_check/.test(m)) return "Title can be at most 70 characters.";
  if(/_status_chk|status_check/.test(m)) return "That status isn't allowed for this record.";
  if(/_priority_chk/.test(m)) return "That priority isn't allowed.";
  if(/system mailbox/.test(m)) return "The EOS mailbox can't be assigned work.";
  if(/invalid input syntax/.test(m)) return "One of the values isn't in the right format — check dates and numbers.";
  return m;
}
async function refreshAfterEdit(){ cache.notes={}; cache.docs={}; cache.projPeople={}; D.agenda={}; await loadCore(); }
